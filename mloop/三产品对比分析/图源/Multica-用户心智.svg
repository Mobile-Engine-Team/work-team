<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" style="font-family:PingFang SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#f6f5f1"/><text x="30" y="35" font-size="23">Multica · 用户如何理解一次工作</text><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8290a0"/></marker></defs><path d="M300 110H362" fill="none" stroke="#8290a0" stroke-width="2" marker-end="url(#ar)"/><text x="330" y="96" font-size="13" text-anchor="middle" fill="#626a73">进入</text><path d="M635 110H697" fill="none" stroke="#8290a0" stroke-width="2" marker-end="url(#ar)"/><text x="665" y="96" font-size="13" text-anchor="middle" fill="#626a73">组织</text><path d="M835 155V327" fill="none" stroke="#8290a0" stroke-width="2" marker-end="url(#ar)"/><text x="865" y="245" font-size="13" text-anchor="middle" fill="#626a73">推进</text><path d="M700 375H638" fill="none" stroke="#8290a0" stroke-width="2" marker-end="url(#ar)"/><text x="670" y="361" font-size="13" text-anchor="middle" fill="#626a73">执行</text><path d="M365 375H303" fill="none" stroke="#8290a0" stroke-width="2" marker-end="url(#ar)"/><text x="335" y="361" font-size="13" text-anchor="middle" fill="#626a73">检查</text><path d="M165 330V157" fill="none" stroke="#8290a0" stroke-width="2" marker-end="url(#ar)"/><text x="220" y="245" font-size="13" text-anchor="middle" fill="#626a73">返工 / 新需求</text><rect x="30" y="65" width="270" height="90" rx="10" fill="white" stroke="#6b55c9"/><text x="45" y="97" font-size="17" fill="#6b55c9">01 先把问题变成事项</text><text x="45" y="126" font-size="13" fill="#626a73">稳定工作编号</text><rect x="365" y="65" width="270" height="90" rx="10" fill="white" stroke="#2563c9"/><text x="380" y="97" font-size="17" fill="#2563c9">02 项目中放入缺陷目标</text><text x="380" y="126" font-size="13" fill="#626a73">项目是组织容器</text><rect x="700" y="65" width="270" height="90" rx="10" fill="white" stroke="#0d8a76"/><text x="715" y="97" font-size="17" fill="#0d8a76">03 事项说明与评论澄清</text><text x="715" y="126" font-size="13" fill="#626a73">评论可触发执行</text><rect x="700" y="330" width="270" height="90" rx="10" fill="white" stroke="#2563c9"/><text x="715" y="362" font-size="17" fill="#2563c9">04 选人 / Agent / Squad</text><text x="715" y="391" font-size="13" fill="#626a73">一个当前负责人</text><rect x="365" y="330" width="270" height="90" rx="10" fill="white" stroke="#c03a68"/><text x="380" y="362" font-size="17" fill="#c03a68">05 Run 记录每轮执行</text><text x="380" y="391" font-size="13" fill="#626a73">多轮不覆盖工作身份</text><rect x="30" y="330" width="270" height="90" rx="10" fill="white" stroke="#0d8a76"/><text x="45" y="362" font-size="17" fill="#0d8a76">06 评审返工并推进事项</text><text x="45" y="391" font-size="13" fill="#626a73">业务状态独立</text><text x="30" y="465" font-size="13" fill="#626a73">示例闭环；箭头表达用户理解与动作顺序，不表示每一步都是产品自动执行。</text></svg>