<svg xmlns="http://www.w3.org/2000/svg" width="1318" height="1595" viewBox="0 0 1318 1595" style="font-family:PingFang SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563c9"/></marker></defs><text x="22" y="28" font-size="18" font-weight="600">建议时序：多人负责、多 Agent 执行、证据验收</text><rect x="17" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="109" y="72" font-size="14" text-anchor="middle">王蕾 / 周启明</text><path d="M109 88 V1570" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="225" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="317" y="72" font-size="14" text-anchor="middle">团队工作台</text><path d="M317 88 V1570" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="433" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="525" y="72" font-size="14" text-anchor="middle">WorkItem / Decision</text><path d="M525 88 V1570" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="641" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="733" y="72" font-size="14" text-anchor="middle">调度与权限</text><path d="M733 88 V1570" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="849" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="941" y="72" font-size="14" text-anchor="middle">修复 / 测试 Agent</text><path d="M941 88 V1570" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="1057" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="1149" y="72" font-size="14" text-anchor="middle">陈晓 / QA</text><path d="M1149 88 V1570" stroke="#c6cbd1" stroke-dasharray="5 5"/><g class="event" data-event="0"><rect x="5" y="97" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="129" font-size="12" fill="#727c87">01</text><path d="M109 125 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="540.0" y="100" width="246.0" height="21" fill="white"/><text x="659.0" y="116" text-anchor="middle" font-size="14" fill="#1c2330">建团队项目 P17，邀请并授权成员</text><text x="659.0" y="158" text-anchor="middle" font-size="12" fill="#626a73">团队空间与个人目录分离；项目私有默认最小可见</text><circle cx="109" cy="125" r="3" fill="#6b55c9"/></g><g class="event" data-event="1"><rect x="5" y="187" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="219" font-size="12" fill="#727c87">02</text><path d="M109 215 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="554.0" y="190" width="218.0" height="21" fill="white"/><text x="659.0" y="206" text-anchor="middle" font-size="14" fill="#1c2330">创建 W17，写复现与验收条件</text><text x="659.0" y="248" text-anchor="middle" font-size="12" fill="#626a73">humanOwner=周启明，reviewer=王蕾，QA=陈晓</text><circle cx="109" cy="215" r="3" fill="#6b55c9"/></g><g class="event" data-event="2"><rect x="5" y="277" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="309" font-size="12" fill="#727c87">03</text><path d="M109 305 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="554.0" y="280" width="218.0" height="21" fill="white"/><text x="659.0" y="296" text-anchor="middle" font-size="14" fill="#1c2330">留言澄清；显式选择“请求执行”</text><text x="659.0" y="338" text-anchor="middle" font-size="12" fill="#626a73">评论默认不启动；预览接收者、调用权限、运行模式与预算</text><circle cx="109" cy="305" r="3" fill="#6b55c9"/></g><g class="event" data-event="3"><rect x="5" y="367" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="399" font-size="12" fill="#727c87">04</text><path d="M317 395 H733" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="547.0" y="370" width="232.0" height="21" fill="white"/><text x="659.0" y="386" text-anchor="middle" font-size="14" fill="#1c2330">提交带幂等键与预期版本的派工命令</text><text x="659.0" y="428" text-anchor="middle" font-size="12" fill="#626a73">重复点击同命令只返回同一记录；并发状态冲突要求确认</text><circle cx="317" cy="395" r="3" fill="#6b55c9"/></g><g class="event" data-event="4"><rect x="5" y="457" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="489" font-size="12" fill="#727c87">05</text><path d="M733 485 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="547.0" y="460" width="232.0" height="21" fill="white"/><text x="659.0" y="476" text-anchor="middle" font-size="14" fill="#1c2330">创建 R1 并保存输入上下文快照</text><text x="659.0" y="518" text-anchor="middle" font-size="12" fill="#626a73">记录来源评论、权限版本、资产版本和目录锁</text><circle cx="733" cy="485" r="3" fill="#6b55c9"/></g><g class="event" data-event="5"><rect x="5" y="547" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="579" font-size="12" fill="#727c87">06</text><path d="M733 575 H941" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="547.0" y="550" width="232.0" height="21" fill="white"/><text x="659.0" y="566" text-anchor="middle" font-size="14" fill="#1c2330">指定 runtime 执行 R1</text><text x="659.0" y="608" text-anchor="middle" font-size="12" fill="#626a73">本机高风险操作仍走工具授权；离线不自动迁移机器</text><circle cx="733" cy="575" r="3" fill="#6b55c9"/></g><g class="event" data-event="6"><rect x="5" y="637" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="669" font-size="12" fill="#727c87">07</text><path d="M941 665 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="491.0" y="640" width="344.0" height="21" fill="white"/><text x="659.0" y="656" text-anchor="middle" font-size="14" fill="#1c2330">登记不可变 ArtifactVersion v1</text><text x="659.0" y="698" text-anchor="middle" font-size="12" fill="#626a73">文件摘要/仓库提交、来源 R1、可访问位置明确</text><circle cx="941" cy="665" r="3" fill="#6b55c9"/></g><g class="event" data-event="7"><rect x="5" y="727" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="759" font-size="12" fill="#727c87">08</text><path d="M733 755 H941" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="547.0" y="730" width="232.0" height="21" fill="white"/><text x="659.0" y="746" text-anchor="middle" font-size="14" fill="#1c2330">按 QA 授权和指定目录发起测试</text><text x="659.0" y="788" text-anchor="middle" font-size="12" fill="#626a73">修复 Agent 不能自己替人类批准；共享目录不可无锁并跑</text><circle cx="733" cy="755" r="3" fill="#6b55c9"/></g><g class="event" data-event="8"><rect x="5" y="817" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="849" font-size="12" fill="#727c87">09</text><path d="M941 845 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="456.0" y="820" width="414.0" height="21" fill="white"/><text x="659.0" y="836" text-anchor="middle" font-size="14" fill="#1c2330">登记 TestEvidence QA1：预期 1，实际 2</text><text x="659.0" y="878" text-anchor="middle" font-size="12" fill="#626a73">示例失败；测试日志与 v1 绑定</text><circle cx="941" cy="845" r="3" fill="#6b55c9"/></g><g class="event" data-event="9"><rect x="5" y="907" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="939" font-size="12" fill="#727c87">10</text><path d="M1149 935 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="561.0" y="910" width="204.0" height="21" fill="white"/><text x="659.0" y="926" text-anchor="middle" font-size="14" fill="#1c2330">陈晓提交返工决定，说明失败点</text><text x="659.0" y="968" text-anchor="middle" font-size="12" fill="#626a73">生成新决策记录；不删除 R1/QA1</text><circle cx="1149" cy="935" r="3" fill="#6b55c9"/></g><g class="event" data-event="10"><rect x="5" y="997" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="1029" font-size="12" fill="#727c87">11</text><path d="M109 1025 H733" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="568.0" y="1000" width="190.0" height="21" fill="white"/><text x="659.0" y="1016" text-anchor="middle" font-size="14" fill="#1c2330">周启明确认下一轮请求 R2</text><text x="659.0" y="1058" text-anchor="middle" font-size="12" fill="#626a73">预算与循环上限重新检查；超额先暂停</text><circle cx="109" cy="1025" r="3" fill="#6b55c9"/></g><g class="event" data-event="11"><rect x="5" y="1087" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="1119" font-size="12" fill="#727c87">12</text><path d="M941 1115 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="526.0" y="1090" width="274.0" height="21" fill="white"/><text x="659.0" y="1106" text-anchor="middle" font-size="14" fill="#1c2330">R2 → v2；测试生成 QA2 通过</text><text x="659.0" y="1148" text-anchor="middle" font-size="12" fill="#626a73">同一 W17 新执行与新证据，旧证据不可被覆盖</text><circle cx="941" cy="1115" r="3" fill="#6b55c9"/></g><g class="event" data-event="12"><rect x="5" y="1177" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="1209" font-size="12" fill="#727c87">13</text><path d="M109 1205 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="463.0" y="1180" width="400.0" height="21" fill="white"/><text x="659.0" y="1196" text-anchor="middle" font-size="14" fill="#1c2330">提交 ReviewRequest：指定 v2 + QA2</text><text x="659.0" y="1238" text-anchor="middle" font-size="12" fill="#626a73">只有有权评审者可批准，检查最新版本和证据完整性</text><circle cx="109" cy="1205" r="3" fill="#6b55c9"/></g><g class="event" data-event="13"><rect x="5" y="1267" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="1299" font-size="12" fill="#727c87">14</text><path d="M109 1295 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="603.0" y="1270" width="120.0" height="21" fill="white"/><text x="659.0" y="1286" text-anchor="middle" font-size="14" fill="#1c2330">王蕾明确验收通过</text><text x="659.0" y="1328" text-anchor="middle" font-size="12" fill="#626a73">Decision 引用 W17版本、v2摘要和 QA2；过期证据拒绝批准</text><circle cx="109" cy="1295" r="3" fill="#6b55c9"/></g><g class="event" data-event="14"><rect x="5" y="1357" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="1389" font-size="12" fill="#727c87">15</text><path d="M525 1385 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="519.0" y="1360" width="288.0" height="21" fill="white"/><text x="659.0" y="1376" text-anchor="middle" font-size="14" fill="#1c2330">将 W17 标 done 并发布主线摘要</text><text x="659.0" y="1418" text-anchor="middle" font-size="12" fill="#626a73">决策、状态、通知采用可靠事件处理；P0 无自动发布外部系统</text><circle cx="525" cy="1385" r="3" fill="#6b55c9"/></g><g class="event" data-event="15"><rect x="5" y="1447" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="1479" font-size="12" fill="#727c87">16</text><path d="M317 1475 H1149" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="561.0" y="1450" width="204.0" height="21" fill="white"/><text x="659.0" y="1466" text-anchor="middle" font-size="14" fill="#1c2330">通知项目成员并支持定位到证据</text><text x="659.0" y="1508" text-anchor="middle" font-size="12" fill="#626a73">不向无权者泄露产物或私有执行日志</text><circle cx="317" cy="1475" r="3" fill="#6b55c9"/></g></svg>