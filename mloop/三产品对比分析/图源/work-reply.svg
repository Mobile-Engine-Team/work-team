<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="875" viewBox="0 0 1110 875" style="font-family:PingFang SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563c9"/></marker></defs><text x="22" y="28" font-size="18" font-weight="600">MobileWork 微时序：追问、排队与权限</text><rect x="17" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="109" y="72" font-size="14" text-anchor="middle">用户</text><path d="M109 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="225" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="317" y="72" font-size="14" text-anchor="middle">任务输入区</text><path d="M317 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="433" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="525" y="72" font-size="14" text-anchor="middle">Session / 引擎</text><path d="M525 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="641" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="733" y="72" font-size="14" text-anchor="middle">主专家 / 子代理</text><path d="M733 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="849" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="941" y="72" font-size="14" text-anchor="middle">工具 / 文件</text><path d="M941 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><g class="event" data-event="0"><rect x="5" y="97" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="129" font-size="12" fill="#727c87">01</text><path d="M109 125 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="443.0" y="100" width="232.0" height="21" fill="white"/><text x="555.0" y="116" text-anchor="middle" font-size="14" fill="#1c2330">写追问并选择当前模型/专家/工具</text><text x="555.0" y="158" text-anchor="middle" font-size="12" fill="#626a73">当前任务是执行会话，不是共享评论讨论</text><circle cx="109" cy="125" r="3" fill="#6b55c9"/></g><g class="event" data-event="1"><rect x="5" y="187" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="219" font-size="12" fill="#727c87">02</text><path d="M317 215 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="450.0" y="190" width="218.0" height="21" fill="white"/><text x="555.0" y="206" text-anchor="middle" font-size="14" fill="#1c2330">空闲则发送；忙碌则进入待发队列</text><text x="555.0" y="248" text-anchor="middle" font-size="12" fill="#626a73">队列在内存按任务保存，不是持久 run 调度台账</text><circle cx="317" cy="215" r="3" fill="#6b55c9"/></g><g class="event" data-event="2"><rect x="5" y="277" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="309" font-size="12" fill="#727c87">03</text><path d="M525 305 H733" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="513.0" y="280" width="92.0" height="21" fill="white"/><text x="555.0" y="296" text-anchor="middle" font-size="14" fill="#1c2330">执行当前回合</text><text x="555.0" y="338" text-anchor="middle" font-size="12" fill="#626a73">后续设置不改变当前回合</text><circle cx="525" cy="305" r="3" fill="#6b55c9"/></g><g class="event" data-event="3"><rect x="5" y="367" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="399" font-size="12" fill="#727c87">04</text><path d="M733 395 H109" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478.0" y="370" width="162.0" height="21" fill="white"/><text x="555.0" y="386" text-anchor="middle" font-size="14" fill="#1c2330">需人工授权时显示待确认</text><text x="555.0" y="428" text-anchor="middle" font-size="12" fill="#626a73">主/子会话显示来源；等待应答仍算忙</text><circle cx="733" cy="395" r="3" fill="#6b55c9"/></g><g class="event" data-event="4"><rect x="5" y="457" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="489" font-size="12" fill="#727c87">05</text><path d="M109 485 H941" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="485.0" y="460" width="148.0" height="21" fill="white"/><text x="555.0" y="476" text-anchor="middle" font-size="14" fill="#1c2330">授权后才允许实际操作</text><text x="555.0" y="518" text-anchor="middle" font-size="12" fill="#626a73">安全许可与业务验收分开</text><circle cx="109" cy="485" r="3" fill="#6b55c9"/></g><g class="event" data-event="5"><rect x="5" y="547" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="579" font-size="12" fill="#727c87">06</text><path d="M733 575 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478.0" y="550" width="162.0" height="21" fill="white"/><text x="555.0" y="566" text-anchor="middle" font-size="14" fill="#1c2330">提交最终结果且引擎空闲</text><text x="555.0" y="608" text-anchor="middle" font-size="12" fill="#626a73">才允许本轮真正结束并继续队列</text><circle cx="733" cy="575" r="3" fill="#6b55c9"/></g><g class="event" data-event="6"><rect x="5" y="637" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="669" font-size="12" fill="#727c87">07</text><path d="M525 665 H733" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="450.0" y="640" width="218.0" height="21" fill="white"/><text x="555.0" y="656" text-anchor="middle" font-size="14" fill="#1c2330">下一条发出时读取当时的模型配置</text><text x="555.0" y="698" text-anchor="middle" font-size="12" fill="#626a73">排队时间的配置不一定就是执行时配置</text><circle cx="525" cy="665" r="3" fill="#6b55c9"/></g><g class="event" data-event="7"><rect x="5" y="727" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="759" font-size="12" fill="#727c87">08</text><path d="M109 755 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="471.0" y="730" width="176.0" height="21" fill="white"/><text x="555.0" y="746" text-anchor="middle" font-size="14" fill="#1c2330">停止、回退或继续处理失败</text><text x="555.0" y="788" text-anchor="middle" font-size="12" fill="#626a73">有限停止确认；不承诺外部副作用回滚</text><circle cx="109" cy="755" r="3" fill="#6b55c9"/></g></svg>