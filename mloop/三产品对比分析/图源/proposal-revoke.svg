<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="875" viewBox="0 0 1110 875" style="font-family:PingFang SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563c9"/></marker></defs><text x="22" y="28" font-size="18" font-weight="600">建议时序：离线、撤权与迟到结果</text><rect x="17" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="109" y="72" font-size="14" text-anchor="middle">空间管理员</text><path d="M109 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="225" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="317" y="72" font-size="14" text-anchor="middle">工作项服务</text><path d="M317 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="433" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="525" y="72" font-size="14" text-anchor="middle">调度器</text><path d="M525 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="641" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="733" y="72" font-size="14" text-anchor="middle">运行机器</text><path d="M733 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="849" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="941" y="72" font-size="14" text-anchor="middle">审批人</text><path d="M941 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><g class="event" data-event="0"><rect x="5" y="97" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="129" font-size="12" fill="#727c87">01</text><path d="M109 125 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="380.0" y="100" width="358.0" height="21" fill="white"/><text x="555.0" y="116" text-anchor="middle" font-size="14" fill="#1c2330">移除成员或撤销 Agent/runtime 调用权</text><text x="555.0" y="158" text-anchor="middle" font-size="12" fill="#626a73">撤销后立刻禁止新派单；历史保留与资产交接按策略</text><circle cx="109" cy="125" r="3" fill="#6b55c9"/></g><g class="event" data-event="1"><rect x="5" y="187" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="219" font-size="12" fill="#727c87">02</text><path d="M317 215 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="387.0" y="190" width="344.0" height="21" fill="white"/><text x="555.0" y="206" text-anchor="middle" font-size="14" fill="#1c2330">标记受影响运行 cancel_requested</text><text x="555.0" y="248" text-anchor="middle" font-size="12" fill="#626a73">记录撤权原因和权限版本，不伪装机器已停止</text><circle cx="317" cy="215" r="3" fill="#6b55c9"/></g><g class="event" data-event="2"><rect x="5" y="277" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="309" font-size="12" fill="#727c87">03</text><path d="M525 305 H733" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="443.0" y="280" width="232.0" height="21" fill="white"/><text x="555.0" y="296" text-anchor="middle" font-size="14" fill="#1c2330">发送取消请求；若离线则显示未确认</text><text x="555.0" y="338" text-anchor="middle" font-size="12" fill="#626a73">机器可能已在执行，控制面不能保证立刻杀掉</text><circle cx="525" cy="305" r="3" fill="#6b55c9"/></g><g class="event" data-event="3"><rect x="5" y="367" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="399" font-size="12" fill="#727c87">04</text><path d="M733 395 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="443.0" y="370" width="232.0" height="21" fill="white"/><text x="555.0" y="386" text-anchor="middle" font-size="14" fill="#1c2330">机器重连，回报真实退出与已做操作</text><text x="555.0" y="428" text-anchor="middle" font-size="12" fill="#626a73">可确认 cancelled；已写文件仍需人工评估补偿</text><circle cx="733" cy="395" r="3" fill="#6b55c9"/></g><g class="event" data-event="4"><rect x="5" y="457" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="489" font-size="12" fill="#727c87">05</text><path d="M733 485 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="429.0" y="460" width="260.0" height="21" fill="white"/><text x="555.0" y="476" text-anchor="middle" font-size="14" fill="#1c2330">迟到结果附原 Run 与产物版本回交</text><text x="555.0" y="518" text-anchor="middle" font-size="12" fill="#626a73">保存为历史证据，不自动覆盖更新的工作状态</text><circle cx="733" cy="485" r="3" fill="#6b55c9"/></g><g class="event" data-event="5"><rect x="5" y="547" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="579" font-size="12" fill="#727c87">06</text><path d="M941 575 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="492.0" y="550" width="134.0" height="21" fill="white"/><text x="555.0" y="566" text-anchor="middle" font-size="14" fill="#1c2330">尝试批准旧版 v1</text><text x="555.0" y="608" text-anchor="middle" font-size="12" fill="#626a73">若当前待审是 v2 或权限已撤销，拒绝并显示原因</text><circle cx="941" cy="575" r="3" fill="#6b55c9"/></g><g class="event" data-event="6"><rect x="5" y="637" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="669" font-size="12" fill="#727c87">07</text><path d="M317 665 H941" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="464.0" y="640" width="190.0" height="21" fill="white"/><text x="555.0" y="656" text-anchor="middle" font-size="14" fill="#1c2330">展示差异、版本与受影响证据</text><text x="555.0" y="698" text-anchor="middle" font-size="12" fill="#626a73">用户显式提交新请求；旧批准不继承</text><circle cx="317" cy="665" r="3" fill="#6b55c9"/></g><g class="event" data-event="7"><rect x="5" y="727" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="759" font-size="12" fill="#727c87">08</text><path d="M109 755 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="464.0" y="730" width="190.0" height="21" fill="white"/><text x="555.0" y="746" text-anchor="middle" font-size="14" fill="#1c2330">决定是否迁移机器或恢复执行</text><text x="555.0" y="788" text-anchor="middle" font-size="12" fill="#626a73">P0 由人选新机器、重新授权并创建新 Run，不隐式续跑</text><circle cx="109" cy="755" r="3" fill="#6b55c9"/></g></svg>