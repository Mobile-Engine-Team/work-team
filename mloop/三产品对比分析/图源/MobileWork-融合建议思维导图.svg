<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2055" viewBox="0 0 1120 2055" style="font-family:PingFang SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#f6f5f1"/><rect x="25" y="20" width="1065" height="58" rx="10" fill="#f1edfc" stroke="#6b55c9"/><text x="45" y="57" font-size="23" fill="#6b55c9">MobileWork 多人多智能体融合建议 · 全景功能树（尚未实现）</text><path d="M70 78V140H120" stroke="#6b55c9" fill="none"/><rect x="120" y="115" width="265" height="50" rx="8" fill="white" stroke="#2563c9"/><text x="138" y="146" font-size="17" fill="#2563c9">团队空间与身份</text><path d="M385 140H410V134H430" stroke="#9bb9d2" fill="none"/><text x="440" y="139" font-size="14" fill="#1c2330">组织/团队空间与本地工作空间分离</text><path d="M385 140H410V167H430" stroke="#9bb9d2" fill="none"/><text x="440" y="172" font-size="14" fill="#1c2330">邀请、接受、撤销、移除与离职交接</text><path d="M385 140H410V200H430" stroke="#9bb9d2" fill="none"/><text x="440" y="205" font-size="14" fill="#1c2330">owner/admin/member 与项目角色</text><path d="M385 140H410V233H430" stroke="#9bb9d2" fill="none"/><text x="440" y="238" font-size="14" fill="#1c2330">私有项目成员校验；管理员不自动读私有内容</text><path d="M385 140H410V266H430" stroke="#9bb9d2" fill="none"/><text x="440" y="271" font-size="14" fill="#1c2330">Agent 实例、所有者、调用 Access、机器授权分开</text><path d="M70 78V365H120" stroke="#6b55c9" fill="none"/><rect x="120" y="340" width="265" height="50" rx="8" fill="white" stroke="#2563c9"/><text x="138" y="371" font-size="17" fill="#2563c9">共享工作主线</text><path d="M385 365H410V359H430" stroke="#9bb9d2" fill="none"/><text x="440" y="364" font-size="14" fill="#1c2330">项目目标、成员、资料与验收标准</text><path d="M385 365H410V392H430" stroke="#9bb9d2" fill="none"/><text x="440" y="397" font-size="14" fill="#1c2330">工作项：标题、描述、优先级、日期、父子关系</text><path d="M385 365H410V425H430" stroke="#9bb9d2" fill="none"/><text x="440" y="430" font-size="14" fill="#1c2330">一个人类责任人；执行 Agent 可另选</text><path d="M385 365H410V458H430" stroke="#9bb9d2" fill="none"/><text x="440" y="463" font-size="14" fill="#1c2330">todo/in_progress/in_review/blocked/done/cancelled</text><path d="M385 365H410V491H430" stroke="#9bb9d2" fill="none"/><text x="440" y="496" font-size="14" fill="#1c2330">状态、负责人、订阅、运行各自独立</text><path d="M385 365H410V524H430" stroke="#9bb9d2" fill="none"/><text x="440" y="529" font-size="14" fill="#1c2330">团队讨论 / 事项评论；P1 再扩完整频道话题</text><path d="M70 78V623H120" stroke="#6b55c9" fill="none"/><rect x="120" y="598" width="265" height="50" rx="8" fill="white" stroke="#2563c9"/><text x="138" y="629" font-size="17" fill="#2563c9">评论、回复与通知</text><path d="M385 623H410V617H430" stroke="#9bb9d2" fill="none"/><text x="440" y="622" font-size="14" fill="#1c2330">顶层评论与同根嵌套回复</text><path d="M385 623H410V650H430" stroke="#9bb9d2" fill="none"/><text x="440" y="655" font-size="14" fill="#1c2330">文本、代码、链接、附件与编辑标记</text><path d="M385 623H410V683H430" stroke="#9bb9d2" fill="none"/><text x="440" y="688" font-size="14" fill="#1c2330">作者编辑/删除；管理删除留审计</text><path d="M385 623H410V716H430" stroke="#9bb9d2" fill="none"/><text x="440" y="721" font-size="14" fill="#1c2330">删根留占位与回复；实际清理遵循保留政策</text><path d="M385 623H410V749H430" stroke="#9bb9d2" fill="none"/><text x="440" y="754" font-size="14" fill="#1c2330">默认只留言；请求执行需显式确认目标</text><path d="M385 623H410V782H430" stroke="#9bb9d2" fill="none"/><text x="440" y="787" font-size="14" fill="#1c2330">@人通知；@Agent 提供执行预览</text><path d="M385 623H410V815H430" stroke="#9bb9d2" fill="none"/><text x="440" y="820" font-size="14" fill="#1c2330">表情不启动；解决讨论不等于验收</text><path d="M385 623H410V848H430" stroke="#9bb9d2" fill="none"/><text x="440" y="853" font-size="14" fill="#1c2330">订阅、直接提及、未读、失败通知去重</text><path d="M385 623H410V881H430" stroke="#9bb9d2" fill="none"/><text x="440" y="886" font-size="14" fill="#1c2330">P1 选区批注、结论替换、评论转子项</text><path d="M70 78V980H120" stroke="#6b55c9" fill="none"/><rect x="120" y="955" width="265" height="50" rx="8" fill="white" stroke="#2563c9"/><text x="138" y="986" font-size="17" fill="#2563c9">多 Agent 执行</text><path d="M385 980H410V974H430" stroke="#9bb9d2" fill="none"/><text x="440" y="979" font-size="14" fill="#1c2330">主协调 Agent + 有职责的修复/测试成员</text><path d="M385 980H410V1007H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1012" font-size="14" fill="#1c2330">P0 指定 runtime；不自动跨机器迁移</text><path d="M385 980H410V1040H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1045" font-size="14" fill="#1c2330">一次 Run 独立状态、上下文快照和触发来源</text><path d="M385 980H410V1073H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1078" font-size="14" fill="#1c2330">相同命令幂等；排队去重与状态原子校验</text><path d="M385 980H410V1106H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1111" font-size="14" fill="#1c2330">共享目录串行；独立目录/worktree 才并行</text><path d="M385 980H410V1139H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1144" font-size="14" fill="#1c2330">预算、轮数、超时、循环检测与暂停</text><path d="M385 980H410V1172H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1177" font-size="14" fill="#1c2330">人工优先停止；控制面取消与机器确认分开</text><path d="M70 78V1271H120" stroke="#6b55c9" fill="none"/><rect x="120" y="1246" width="265" height="50" rx="8" fill="white" stroke="#2563c9"/><text x="138" y="1277" font-size="17" fill="#2563c9">成果、回归与验收</text><path d="M385 1271H410V1265H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1270" font-size="14" fill="#1c2330">ArtifactVersion：不可变版本、摘要、来源 Run</text><path d="M385 1271H410V1298H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1303" font-size="14" fill="#1c2330">TestEvidence：输入、预期、实际、环境、日志</text><path d="M385 1271H410V1331H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1336" font-size="14" fill="#1c2330">ReviewRequest：指定版本与验收人</text><path d="M385 1271H410V1364H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1369" font-size="14" fill="#1c2330">Decision：通过/返工/驳回，绑定证据版本</text><path d="M385 1271H410V1397H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1402" font-size="14" fill="#1c2330">新版本不继承旧批准；要求重新评审</text><path d="M385 1271H410V1430H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1435" font-size="14" fill="#1c2330">显式回主线：里程碑、阻塞、产物、验收</text><path d="M70 78V1529H120" stroke="#6b55c9" fill="none"/><rect x="120" y="1504" width="265" height="50" rx="8" fill="white" stroke="#2563c9"/><text x="138" y="1535" font-size="17" fill="#2563c9">个人能力复用</text><path d="M385 1529H410V1523H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1528" font-size="14" fill="#1c2330">专家/技能资产 → 授权后实例化团队 Agent</text><path d="M385 1529H410V1556H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1561" font-size="14" fill="#1c2330">连接器定义复用，密钥按运行边界引用</text><path d="M385 1529H410V1589H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1594" font-size="14" fill="#1c2330">桌面浏览器与手动接管</text><path d="M385 1529H410V1622H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1627" font-size="14" fill="#1c2330">本地/远程文件成果与预览</text><path d="M385 1529H410V1655H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1660" font-size="14" fill="#1c2330">现有 HITL、模型选择、错误恢复</text><path d="M385 1529H410V1688H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1693" font-size="14" fill="#1c2330">个人记忆与私有会话默认不共享</text><path d="M70 78V1787H120" stroke="#6b55c9" fill="none"/><rect x="120" y="1762" width="265" height="50" rx="8" fill="white" stroke="#2563c9"/><text x="138" y="1793" font-size="17" fill="#2563c9">治理与运营</text><path d="M385 1787H410V1781H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1786" font-size="14" fill="#1c2330">操作审计、可解释投递与权限拒绝</text><path d="M385 1787H410V1814H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1819" font-size="14" fill="#1c2330">工具许可与业务决策分开呈现</text><path d="M385 1787H410V1847H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1852" font-size="14" fill="#1c2330">成员移除撤权、停止新派单、资产交接</text><path d="M385 1787H410V1880H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1885" font-size="14" fill="#1c2330">模型与运行成本、预算配额、异常暂停</text><path d="M385 1787H410V1913H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1918" font-size="14" fill="#1c2330">团队可观测台：工作、运行、产物、决策</text><path d="M385 1787H410V1946H430" stroke="#9bb9d2" fill="none"/><text x="440" y="1951" font-size="14" fill="#1c2330">隐私、保留/删除、导出与恢复策略</text></svg>