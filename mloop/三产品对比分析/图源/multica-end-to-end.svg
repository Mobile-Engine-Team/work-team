<svg xmlns="http://www.w3.org/2000/svg" width="1318" height="1775" viewBox="0 0 1318 1775" style="font-family:PingFang SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563c9"/></marker></defs><text x="22" y="28" font-size="18" font-weight="600">Multica：持续事项跨越多次运行</text><rect x="17" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="109" y="72" font-size="14" text-anchor="middle">王蕾 / 管理员</text><path d="M109 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="225" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="317" y="72" font-size="14" text-anchor="middle">Multica 页面</text><path d="M317 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="433" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="525" y="72" font-size="14" text-anchor="middle">Project / Issue</text><path d="M525 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="641" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="733" y="72" font-size="14" text-anchor="middle">分派与调度</text><path d="M733 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="849" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="941" y="72" font-size="14" text-anchor="middle">Agent / Runtime</text><path d="M941 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="1057" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="1149" y="72" font-size="14" text-anchor="middle">周启明 / 陈晓</text><path d="M1149 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><g class="event" data-event="0"><rect x="5" y="97" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="129" font-size="12" fill="#727c87">01</text><path d="M109 125 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="589.0" y="100" width="148.0" height="21" fill="white"/><text x="659.0" y="116" text-anchor="middle" font-size="14" fill="#1c2330">准备工作区并邀请成员</text><text x="659.0" y="158" text-anchor="middle" font-size="12" fill="#626a73">受邀成员接受；至少保留一名 owner</text><circle cx="109" cy="125" r="3" fill="#6b55c9"/></g><g class="event" data-event="1"><rect x="5" y="187" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="219" font-size="12" fill="#727c87">02</text><path d="M109 215 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="449.0" y="190" width="428.0" height="21" fill="white"/><text x="659.0" y="206" text-anchor="middle" font-size="14" fill="#1c2330">连接 runtime，创建 Agent 并配置 Access</text><text x="659.0" y="248" text-anchor="middle" font-size="12" fill="#626a73">Agent 调用权限与 runtime 共享分别授权</text><circle cx="109" cy="215" r="3" fill="#6b55c9"/></g><g class="event" data-event="2"><rect x="5" y="277" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="309" font-size="12" fill="#727c87">03</text><path d="M109 305 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="582.0" y="280" width="162.0" height="21" fill="white"/><text x="659.0" y="296" text-anchor="middle" font-size="14" fill="#1c2330">建项目、说明与代码资源</text><text x="659.0" y="338" text-anchor="middle" font-size="12" fill="#626a73">项目可设工作流；本地共享目录串行或 worktree 并行</text><circle cx="109" cy="305" r="3" fill="#6b55c9"/></g><g class="event" data-event="3"><rect x="5" y="367" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="399" font-size="12" fill="#727c87">04</text><path d="M109 395 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="533.0" y="370" width="260.0" height="21" fill="white"/><text x="659.0" y="386" text-anchor="middle" font-size="14" fill="#1c2330">创建缺陷事项 W17，填写复现与标准</text><text x="659.0" y="428" text-anchor="middle" font-size="12" fill="#626a73">issue 是持续工作身份，和后续 run 分开</text><circle cx="109" cy="395" r="3" fill="#6b55c9"/></g><g class="event" data-event="4"><rect x="5" y="457" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="489" font-size="12" fill="#727c87">05</text><path d="M1149 485 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="575.0" y="460" width="176.0" height="21" fill="white"/><text x="659.0" y="476" text-anchor="middle" font-size="14" fill="#1c2330">评论澄清，必要时选区批注</text><text x="659.0" y="518" text-anchor="middle" font-size="12" fill="#626a73">引用保留快照，发送前可预览触发目标</text><circle cx="1149" cy="485" r="3" fill="#6b55c9"/></g><g class="event" data-event="5"><rect x="5" y="547" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="579" font-size="12" fill="#727c87">06</text><path d="M109 575 H733" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="498.0" y="550" width="330.0" height="21" fill="white"/><text x="659.0" y="566" text-anchor="middle" font-size="14" fill="#1c2330">指派 Agent / Squad，选择开始方式</text><text x="659.0" y="608" text-anchor="middle" font-size="12" fill="#626a73">暂不开始仅保存；backlog 不执行；指派 Squad 先唤醒 leader</text><circle cx="109" cy="575" r="3" fill="#6b55c9"/></g><g class="event" data-event="6"><rect x="5" y="637" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="669" font-size="12" fill="#727c87">07</text><path d="M733 665 H941" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="498.0" y="640" width="330.0" height="21" fill="white"/><text x="659.0" y="656" text-anchor="middle" font-size="14" fill="#1c2330">创建 R1，绑定原 runtime 排队与领取</text><text x="659.0" y="698" text-anchor="middle" font-size="12" fill="#626a73">queued / dispatched / 等目录 / running 逐层推进</text><circle cx="733" cy="665" r="3" fill="#6b55c9"/></g><g class="event" data-event="7"><rect x="5" y="727" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="759" font-size="12" fill="#727c87">08</text><path d="M941 755 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="547.0" y="730" width="232.0" height="21" fill="white"/><text x="659.0" y="746" text-anchor="middle" font-size="14" fill="#1c2330">回写日志、补丁 v1 和运行结果</text><text x="659.0" y="788" text-anchor="middle" font-size="12" fill="#626a73">run completed 不自动表示 issue done</text><circle cx="941" cy="755" r="3" fill="#6b55c9"/></g><g class="event" data-event="8"><rect x="5" y="817" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="849" font-size="12" fill="#727c87">09</text><path d="M941 845 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="547.0" y="820" width="232.0" height="21" fill="white"/><text x="659.0" y="836" text-anchor="middle" font-size="14" fill="#1c2330">按工作流动作更新事项或交回人评审</text><text x="659.0" y="878" text-anchor="middle" font-size="12" fill="#626a73">run 结束本身不自动改业务状态；需执行者更新</text><circle cx="941" cy="845" r="3" fill="#6b55c9"/></g><g class="event" data-event="9"><rect x="5" y="907" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="939" font-size="12" fill="#727c87">10</text><path d="M1149 935 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="554.0" y="910" width="218.0" height="21" fill="white"/><text x="659.0" y="926" text-anchor="middle" font-size="14" fill="#1c2330">陈晓批注失败点，记录预期与实际</text><text x="659.0" y="968" text-anchor="middle" font-size="12" fill="#626a73">可将某条回复设结论；reply 会重开已解决讨论</text><circle cx="1149" cy="935" r="3" fill="#6b55c9"/></g><g class="event" data-event="10"><rect x="5" y="997" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="1029" font-size="12" fill="#727c87">11</text><path d="M1149 1025 H733" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="561.0" y="1000" width="204.0" height="21" fill="white"/><text x="659.0" y="1016" text-anchor="middle" font-size="14" fill="#1c2330">返工分支：按失败目标重新交接</text><text x="659.0" y="1058" text-anchor="middle" font-size="12" fill="#626a73">工作流是项目状态路由；切换默认可确认取消前一 Agent 运行</text><circle cx="1149" cy="1025" r="3" fill="#6b55c9"/></g><g class="event" data-event="11"><rect x="5" y="1087" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="1119" font-size="12" fill="#727c87">12</text><path d="M733 1115 H941" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="540.0" y="1090" width="246.0" height="21" fill="white"/><text x="659.0" y="1106" text-anchor="middle" font-size="14" fill="#1c2330">创建后续 R2，保留 W17 身份</text><text x="659.0" y="1148" text-anchor="middle" font-size="12" fill="#626a73">不同运行记录不覆盖前一轮证据</text><circle cx="733" cy="1115" r="3" fill="#6b55c9"/></g><g class="event" data-event="12"><rect x="5" y="1177" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="1209" font-size="12" fill="#727c87">13</text><path d="M941 1205 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="568.0" y="1180" width="190.0" height="21" fill="white"/><text x="659.0" y="1196" text-anchor="middle" font-size="14" fill="#1c2330">交回补丁 v2 与测试输出</text><text x="659.0" y="1238" text-anchor="middle" font-size="12" fill="#626a73">正文附件/评论产物与输入描述附件用途区分</text><circle cx="941" cy="1205" r="3" fill="#6b55c9"/></g><g class="event" data-event="13"><rect x="5" y="1267" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="1299" font-size="12" fill="#727c87">14</text><path d="M1149 1295 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="547.0" y="1270" width="232.0" height="21" fill="white"/><text x="659.0" y="1286" text-anchor="middle" font-size="14" fill="#1c2330">复测通过，关联 v2 并记录结论</text><text x="659.0" y="1328" text-anchor="middle" font-size="12" fill="#626a73">同一讨论只保留一个选定结论</text><circle cx="1149" cy="1295" r="3" fill="#6b55c9"/></g><g class="event" data-event="14"><rect x="5" y="1357" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="1389" font-size="12" fill="#727c87">15</text><path d="M109 1385 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="547.0" y="1360" width="232.0" height="21" fill="white"/><text x="659.0" y="1376" text-anchor="middle" font-size="14" fill="#1c2330">王蕾确认业务通过并推进 done</text><text x="659.0" y="1418" text-anchor="middle" font-size="12" fill="#626a73">或由符合规则的集成更新；不能用运行结束替代</text><circle cx="109" cy="1385" r="3" fill="#6b55c9"/></g><g class="event" data-event="15"><rect x="5" y="1447" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="1479" font-size="12" fill="#727c87">16</text><path d="M525 1475 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="561.0" y="1450" width="204.0" height="21" fill="white"/><text x="659.0" y="1466" text-anchor="middle" font-size="14" fill="#1c2330">事项订阅者收通知并标读/归档</text><text x="659.0" y="1508" text-anchor="middle" font-size="12" fill="#626a73">直接提及仍通知取消订阅者；自己操作不自通知</text><circle cx="525" cy="1475" r="3" fill="#6b55c9"/></g><g class="event" data-event="16"><rect x="5" y="1537" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="1569" font-size="12" fill="#727c87">17</text><path d="M109 1565 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="540.0" y="1540" width="246.0" height="21" fill="white"/><text x="659.0" y="1556" text-anchor="middle" font-size="14" fill="#1c2330">看项目进度与 Agent 运行费用</text><text x="659.0" y="1598" text-anchor="middle" font-size="12" fill="#626a73">done/closed 比例不是项目状态自动完成；费用是估算</text><circle cx="109" cy="1565" r="3" fill="#6b55c9"/></g><g class="event" data-event="17"><rect x="5" y="1627" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="1659" font-size="12" fill="#727c87">18</text><path d="M109 1655 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="610.0" y="1630" width="106.0" height="21" fill="white"/><text x="659.0" y="1646" text-anchor="middle" font-size="14" fill="#1c2330">整理视图与历史</text><text x="659.0" y="1688" text-anchor="middle" font-size="12" fill="#626a73">事项保留证据，项目删除只解除关联，不删除事项</text><circle cx="109" cy="1655" r="3" fill="#6b55c9"/></g></svg>