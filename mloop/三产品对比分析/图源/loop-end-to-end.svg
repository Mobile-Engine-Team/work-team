<svg xmlns="http://www.w3.org/2000/svg" width="1318" height="1775" viewBox="0 0 1318 1775" style="font-family:PingFang SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563c9"/></marker></defs><text x="22" y="28" font-size="18" font-weight="600">Loop：从频道协作到任务评审</text><rect x="17" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="109" y="72" font-size="14" text-anchor="middle">王蕾 / 管理员</text><path d="M109 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="225" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="317" y="72" font-size="14" text-anchor="middle">Loop 页面</text><path d="M317 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="433" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="525" y="72" font-size="14" text-anchor="middle">频道 / Task</text><path d="M525 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="641" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="733" y="72" font-size="14" text-anchor="middle">消息路由</text><path d="M733 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="849" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="941" y="72" font-size="14" text-anchor="middle">Agent / Machine</text><path d="M941 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="1057" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="1149" y="72" font-size="14" text-anchor="middle">周启明 / 陈晓</text><path d="M1149 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><g class="event" data-event="0"><rect x="5" y="97" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="129" font-size="12" fill="#727c87">01</text><path d="M109 125 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="568.0" y="100" width="190.0" height="21" fill="white"/><text x="659.0" y="116" text-anchor="middle" font-size="14" fill="#1c2330">准备工作区并邀请开发、测试</text><text x="659.0" y="158" text-anchor="middle" font-size="12" fill="#626a73">成员接受邀请；角色与频道成员分别校验</text><circle cx="109" cy="125" r="3" fill="#6b55c9"/></g><g class="event" data-event="1"><rect x="5" y="187" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="219" font-size="12" fill="#727c87">02</text><path d="M317 215 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="596.0" y="190" width="134.0" height="21" fill="white"/><text x="659.0" y="206" text-anchor="middle" font-size="14" fill="#1c2330">创建或加入问题频道</text><text x="659.0" y="248" text-anchor="middle" font-size="12" fill="#626a73">普通频道默认 private；未加入不能看消息</text><circle cx="317" cy="215" r="3" fill="#6b55c9"/></g><g class="event" data-event="2"><rect x="5" y="277" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="309" font-size="12" fill="#727c87">03</text><path d="M109 305 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="533.0" y="280" width="260.0" height="21" fill="white"/><text x="659.0" y="296" text-anchor="middle" font-size="14" fill="#1c2330">配置修复与测试 Agent，授权共享</text><text x="659.0" y="338" text-anchor="middle" font-size="12" fill="#626a73">Agent 公开与频道公开分别设置；Machine/runtime 需可用</text><circle cx="109" cy="305" r="3" fill="#6b55c9"/></g><g class="event" data-event="3"><rect x="5" y="367" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="399" font-size="12" fill="#727c87">04</text><path d="M109 395 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="554.0" y="370" width="218.0" height="21" fill="white"/><text x="659.0" y="386" text-anchor="middle" font-size="14" fill="#1c2330">频道提出弱网缺陷，进入回复话题</text><text x="659.0" y="428" text-anchor="middle" font-size="12" fill="#626a73">复现、预期、实际在局部话题澄清</text><circle cx="109" cy="395" r="3" fill="#6b55c9"/></g><g class="event" data-event="4"><rect x="5" y="457" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="489" font-size="12" fill="#727c87">05</text><path d="M1149 485 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="582.0" y="460" width="162.0" height="21" fill="white"/><text x="659.0" y="476" text-anchor="middle" font-size="14" fill="#1c2330">补充开发约束与回归条件</text><text x="659.0" y="518" text-anchor="middle" font-size="12" fill="#626a73">讨论与业务责任先明确，避免让所有 Agent 抢答</text><circle cx="1149" cy="485" r="3" fill="#6b55c9"/></g><g class="event" data-event="5"><rect x="5" y="547" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="579" font-size="12" fill="#727c87">06</text><path d="M109 575 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="575.0" y="550" width="176.0" height="21" fill="white"/><text x="659.0" y="566" text-anchor="middle" font-size="14" fill="#1c2330">由话题建任务并设置负责人</text><text x="659.0" y="608" text-anchor="middle" font-size="12" fill="#626a73">任务归单频道，保存来源 refs；指派与状态独立</text><circle cx="109" cy="575" r="3" fill="#6b55c9"/></g><g class="event" data-event="6"><rect x="5" y="637" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="669" font-size="12" fill="#727c87">07</text><path d="M109 665 H733" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="526.0" y="640" width="274.0" height="21" fill="white"/><text x="659.0" y="656" text-anchor="middle" font-size="14" fill="#1c2330">真实提及修复 Agent，明确请求执行</text><text x="659.0" y="698" text-anchor="middle" font-size="12" fill="#626a73">精确启动方式遵循当前任务/话题与权限规则</text><circle cx="109" cy="665" r="3" fill="#6b55c9"/></g><g class="event" data-event="7"><rect x="5" y="727" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="759" font-size="12" fill="#727c87">08</text><path d="M733 755 H941" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="561.0" y="730" width="204.0" height="21" fill="white"/><text x="659.0" y="746" text-anchor="middle" font-size="14" fill="#1c2330">按协作面、共享与投递规则唤醒</text><text x="659.0" y="788" text-anchor="middle" font-size="12" fill="#626a73">普通频道消息不默认广播给所有 Agent</text><circle cx="733" cy="755" r="3" fill="#6b55c9"/></g><g class="event" data-event="8"><rect x="5" y="817" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="849" font-size="12" fill="#727c87">09</text><path d="M941 845 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="575.0" y="820" width="176.0" height="21" fill="white"/><text x="659.0" y="836" text-anchor="middle" font-size="14" fill="#1c2330">回写执行活动与补丁 v1</text><text x="659.0" y="878" text-anchor="middle" font-size="12" fill="#626a73">可观察工具与运行时输入；R1 为示例编号</text><circle cx="941" cy="845" r="3" fill="#6b55c9"/></g><g class="event" data-event="9"><rect x="5" y="907" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="939" font-size="12" fill="#727c87">10</text><path d="M1149 935 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="561.0" y="910" width="204.0" height="21" fill="white"/><text x="659.0" y="926" text-anchor="middle" font-size="14" fill="#1c2330">陈晓回归：预期 1，实际 2</text><text x="659.0" y="968" text-anchor="middle" font-size="12" fill="#626a73">示例失败；把具体差异写到任务讨论</text><circle cx="1149" cy="935" r="3" fill="#6b55c9"/></g><g class="event" data-event="10"><rect x="5" y="997" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="1029" font-size="12" fill="#727c87">11</text><path d="M525 1025 H733" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="512.0" y="1000" width="302.0" height="21" fill="white"/><text x="659.0" y="1016" text-anchor="middle" font-size="14" fill="#1c2330">任务讨论唤醒 Agent assignee</text><text x="659.0" y="1058" text-anchor="middle" font-size="12" fill="#626a73">若 Agent 为 assignee；显式提及可增加接收目标</text><circle cx="525" cy="1025" r="3" fill="#6b55c9"/></g><g class="event" data-event="11"><rect x="5" y="1087" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="1119" font-size="12" fill="#727c87">12</text><path d="M733 1115 H941" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="575.0" y="1090" width="176.0" height="21" fill="white"/><text x="659.0" y="1106" text-anchor="middle" font-size="14" fill="#1c2330">返工分支：请求第二次修复</text><text x="659.0" y="1148" text-anchor="middle" font-size="12" fill="#626a73">运行中普通消息等待后续读取；加急才打断</text><circle cx="733" cy="1115" r="3" fill="#6b55c9"/></g><g class="event" data-event="12"><rect x="5" y="1177" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="1209" font-size="12" fill="#727c87">13</text><path d="M941 1205 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="547.0" y="1180" width="232.0" height="21" fill="white"/><text x="659.0" y="1196" text-anchor="middle" font-size="14" fill="#1c2330">回写补丁 v2 与第二次执行进展</text><text x="659.0" y="1238" text-anchor="middle" font-size="12" fill="#626a73">不承诺聊天 Rewind 会回滚文件</text><circle cx="941" cy="1205" r="3" fill="#6b55c9"/></g><g class="event" data-event="13"><rect x="5" y="1267" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="1299" font-size="12" fill="#727c87">14</text><path d="M1149 1295 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="547.0" y="1270" width="232.0" height="21" fill="white"/><text x="659.0" y="1286" text-anchor="middle" font-size="14" fill="#1c2330">陈晓再次回归：预期 1，实际 1</text><text x="659.0" y="1328" text-anchor="middle" font-size="12" fill="#626a73">示例通过；保留对应 v2 的测试证据</text><circle cx="1149" cy="1295" r="3" fill="#6b55c9"/></g><g class="event" data-event="14"><rect x="5" y="1357" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="1389" font-size="12" fill="#727c87">15</text><path d="M109 1385 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="512.0" y="1360" width="302.0" height="21" fill="white"/><text x="659.0" y="1376" text-anchor="middle" font-size="14" fill="#1c2330">王蕾在 In Review 检查并记录通过</text><text x="659.0" y="1418" text-anchor="middle" font-size="12" fill="#626a73">Browser 用状态、讨论、活动；不是一等 Review Request</text><circle cx="109" cy="1385" r="3" fill="#6b55c9"/></g><g class="event" data-event="15"><rect x="5" y="1447" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="1479" font-size="12" fill="#727c87">16</text><path d="M109 1475 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="568.0" y="1450" width="190.0" height="21" fill="white"/><text x="659.0" y="1466" text-anchor="middle" font-size="14" fill="#1c2330">确认完成并显式发布任务公告</text><text x="659.0" y="1508" text-anchor="middle" font-size="12" fill="#626a73">公告可按里程碑、评审、产物、总结等类别回到来源</text><circle cx="109" cy="1475" r="3" fill="#6b55c9"/></g><g class="event" data-event="16"><rect x="5" y="1537" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="1569" font-size="12" fill="#727c87">17</text><path d="M525 1565 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="568.0" y="1540" width="190.0" height="21" fill="white"/><text x="659.0" y="1556" text-anchor="middle" font-size="14" fill="#1c2330">通知相关成员并在收件箱查阅</text><text x="659.0" y="1598" text-anchor="middle" font-size="12" fill="#626a73">按 Watcher/assignee 等策略；排除本次作者</text><circle cx="525" cy="1565" r="3" fill="#6b55c9"/></g><g class="event" data-event="17"><rect x="5" y="1627" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="1659" font-size="12" fill="#727c87">18</text><path d="M109 1655 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="575.0" y="1630" width="176.0" height="21" fill="white"/><text x="659.0" y="1646" text-anchor="middle" font-size="14" fill="#1c2330">整理话题、未读与任务记录</text><text x="659.0" y="1688" text-anchor="middle" font-size="12" fill="#626a73">空间级归档是管理操作，不能等价于单个任务删除</text><circle cx="109" cy="1655" r="3" fill="#6b55c9"/></g></svg>