<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="875" viewBox="0 0 1110 875" style="font-family:PingFang SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563c9"/></marker></defs><text x="22" y="28" font-size="18" font-weight="600">Multica 微时序：一条评论触发谁</text><rect x="17" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="109" y="72" font-size="14" text-anchor="middle">评论作者</text><path d="M109 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="225" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="317" y="72" font-size="14" text-anchor="middle">评论 / Thread</text><path d="M317 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="433" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="525" y="72" font-size="14" text-anchor="middle">触发预览与路由</text><path d="M525 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="641" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="733" y="72" font-size="14" text-anchor="middle">Agent / Run</text><path d="M733 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="849" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="941" y="72" font-size="14" text-anchor="middle">成员收件箱</text><path d="M941 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><g class="event" data-event="0"><rect x="5" y="97" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="129" font-size="12" fill="#727c87">01</text><path d="M109 125 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478.0" y="100" width="162.0" height="21" fill="white"/><text x="555.0" y="116" text-anchor="middle" font-size="14" fill="#1c2330">写回复、批注或顶层评论</text><text x="555.0" y="158" text-anchor="middle" font-size="12" fill="#626a73">批注引用内的提及不触发；自己填写的真实提及才算</text><circle cx="109" cy="125" r="3" fill="#6b55c9"/></g><g class="event" data-event="1"><rect x="5" y="187" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="219" font-size="12" fill="#727c87">02</text><path d="M317 215 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="450.0" y="190" width="218.0" height="21" fill="white"/><text x="555.0" y="206" text-anchor="middle" font-size="14" fill="#1c2330">预览目标、来源、权限与当前状态</text><text x="555.0" y="248" text-anchor="middle" font-size="12" fill="#626a73">显式提及优先；无提及才考虑兜底</text><circle cx="317" cy="215" r="3" fill="#6b55c9"/></g><g class="event" data-event="2"><rect x="5" y="277" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="309" font-size="12" fill="#727c87">03</text><path d="M525 305 H733" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="359.0" y="280" width="400.0" height="21" fill="white"/><text x="555.0" y="296" text-anchor="middle" font-size="14" fill="#1c2330">回复 Agent → 它；已有 Agent 讨论 → 它</text><text x="555.0" y="338" text-anchor="middle" font-size="12" fill="#626a73">直接回复人类不走负责人兜底；顶层才可能走 Agent owner</text><circle cx="525" cy="305" r="3" fill="#6b55c9"/></g><g class="event" data-event="3"><rect x="5" y="367" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="399" font-size="12" fill="#727c87">04</text><path d="M525 395 H941" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478.0" y="370" width="162.0" height="21" fill="white"/><text x="555.0" y="386" text-anchor="middle" font-size="14" fill="#1c2330">按订阅或直接提及通知人</text><text x="555.0" y="428" text-anchor="middle" font-size="12" fill="#626a73">@all 只通知人并抑制负责人兜底；Agent 没有人类收件箱</text><circle cx="525" cy="395" r="3" fill="#6b55c9"/></g><g class="event" data-event="4"><rect x="5" y="457" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="489" font-size="12" fill="#727c87">05</text><path d="M109 485 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="457.0" y="460" width="204.0" height="21" fill="white"/><text x="555.0" y="476" text-anchor="middle" font-size="14" fill="#1c2330">选择 /note 或取消触发</text><text x="555.0" y="518" text-anchor="middle" font-size="12" fill="#626a73">只保存意见，不要求执行</text><circle cx="109" cy="485" r="3" fill="#6b55c9"/></g><g class="event" data-event="5"><rect x="5" y="547" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="579" font-size="12" fill="#727c87">06</text><path d="M525 575 H733" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="359.0" y="550" width="400.0" height="21" fill="white"/><text x="555.0" y="566" text-anchor="middle" font-size="14" fill="#1c2330">同事项同 Agent 待运行合并，不同 Agent 分开</text><text x="555.0" y="608" text-anchor="middle" font-size="12" fill="#626a73">支持的 runtime 文本 steer 在当前步骤后读取</text><circle cx="525" cy="575" r="3" fill="#6b55c9"/></g><g class="event" data-event="6"><rect x="5" y="637" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="669" font-size="12" fill="#727c87">07</text><path d="M733 665 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="485.0" y="640" width="148.0" height="21" fill="white"/><text x="555.0" y="656" text-anchor="middle" font-size="14" fill="#1c2330">回写执行与已读取回执</text><text x="555.0" y="698" text-anchor="middle" font-size="12" fill="#626a73">带附件或不支持 steer 的场景走后续运行</text><circle cx="733" cy="665" r="3" fill="#6b55c9"/></g><g class="event" data-event="7"><rect x="5" y="727" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="759" font-size="12" fill="#727c87">08</text><path d="M109 755 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="436.0" y="730" width="246.0" height="21" fill="white"/><text x="555.0" y="746" text-anchor="middle" font-size="14" fill="#1c2330">标记解决或选一个结论；后续回复重开</text><text x="555.0" y="788" text-anchor="middle" font-size="12" fill="#626a73">reaction 不触发执行、不改业务状态</text><circle cx="109" cy="755" r="3" fill="#6b55c9"/></g></svg>