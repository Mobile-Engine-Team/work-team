<svg xmlns="http://www.w3.org/2000/svg" width="1318" height="1775" viewBox="0 0 1318 1775" style="font-family:PingFang SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563c9"/></marker></defs><text x="22" y="28" font-size="18" font-weight="600">MobileWork：个人任务到可检查成果</text><rect x="17" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="109" y="72" font-size="14" text-anchor="middle">王蕾 / 当前用户</text><path d="M109 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="225" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="317" y="72" font-size="14" text-anchor="middle">MobileWork 页面</text><path d="M317 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="433" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="525" y="72" font-size="14" text-anchor="middle">Workspace / Session</text><path d="M525 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="641" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="733" y="72" font-size="14" text-anchor="middle">本地引擎</text><path d="M733 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="849" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="941" y="72" font-size="14" text-anchor="middle">主专家 / 工具</text><path d="M941 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="1057" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="1149" y="72" font-size="14" text-anchor="middle">外部开发 / 测试</text><path d="M1149 88 V1750" stroke="#c6cbd1" stroke-dasharray="5 5"/><g class="event" data-event="0"><rect x="5" y="97" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="129" font-size="12" fill="#727c87">01</text><path d="M109 125 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="575.0" y="100" width="176.0" height="21" fill="white"/><text x="659.0" y="116" text-anchor="middle" font-size="14" fill="#1c2330">登录并准备本地或远程空间</text><text x="659.0" y="158" text-anchor="middle" font-size="12" fill="#626a73">默认空间是目录/连接；不是团队成员容器</text><circle cx="109" cy="125" r="3" fill="#6b55c9"/></g><g class="event" data-event="1"><rect x="5" y="187" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="219" font-size="12" fill="#727c87">02</text><path d="M109 215 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="561.0" y="190" width="204.0" height="21" fill="white"/><text x="659.0" y="206" text-anchor="middle" font-size="14" fill="#1c2330">选择主专家、技能、模型与工具</text><text x="659.0" y="248" text-anchor="middle" font-size="12" fill="#626a73">专家全局资产；连接器已连不等于本会话授权</text><circle cx="109" cy="215" r="3" fill="#6b55c9"/></g><g class="event" data-event="2"><rect x="5" y="277" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="309" font-size="12" fill="#727c87">03</text><path d="M109 305 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="568.0" y="280" width="190.0" height="21" fill="white"/><text x="659.0" y="296" text-anchor="middle" font-size="14" fill="#1c2330">首次发送弱网缺陷需求与附件</text><text x="659.0" y="338" text-anchor="middle" font-size="12" fill="#626a73">新 session / 任务目录此时创建；不是共享 issue</text><circle cx="109" cy="305" r="3" fill="#6b55c9"/></g><g class="event" data-event="3"><rect x="5" y="367" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="399" font-size="12" fill="#727c87">04</text><path d="M525 395 H733" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="575.0" y="370" width="176.0" height="21" fill="white"/><text x="659.0" y="386" text-anchor="middle" font-size="14" fill="#1c2330">提交本轮上下文与执行配置</text><text x="659.0" y="428" text-anchor="middle" font-size="12" fill="#626a73">发送时确定模型；当前回合不因后续设置而变化</text><circle cx="525" cy="395" r="3" fill="#6b55c9"/></g><g class="event" data-event="4"><rect x="5" y="457" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="489" font-size="12" fill="#727c87">05</text><path d="M733 485 H941" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="554.0" y="460" width="218.0" height="21" fill="white"/><text x="659.0" y="476" text-anchor="middle" font-size="14" fill="#1c2330">主专家调用子代理、文件或浏览器</text><text x="659.0" y="518" text-anchor="middle" font-size="12" fill="#626a73">专家团属于执行组合；不是多成员组织</text><circle cx="733" cy="485" r="3" fill="#6b55c9"/></g><g class="event" data-event="5"><rect x="5" y="547" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="579" font-size="12" fill="#727c87">06</text><path d="M941 575 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="568.0" y="550" width="190.0" height="21" fill="white"/><text x="659.0" y="566" text-anchor="middle" font-size="14" fill="#1c2330">工具高风险操作请求用户确认</text><text x="659.0" y="608" text-anchor="middle" font-size="12" fill="#626a73">HITL 是工具授权；不是批准修复结果</text><circle cx="941" cy="575" r="3" fill="#6b55c9"/></g><g class="event" data-event="6"><rect x="5" y="637" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="669" font-size="12" fill="#727c87">07</text><path d="M109 665 H733" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="582.0" y="640" width="162.0" height="21" fill="white"/><text x="659.0" y="656" text-anchor="middle" font-size="14" fill="#1c2330">允许本次操作或调整执行</text><text x="659.0" y="698" text-anchor="middle" font-size="12" fill="#626a73">黑名单不因完全访问就被豁免</text><circle cx="109" cy="665" r="3" fill="#6b55c9"/></g><g class="event" data-event="7"><rect x="5" y="727" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="759" font-size="12" fill="#727c87">08</text><path d="M941 755 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="540.0" y="730" width="246.0" height="21" fill="white"/><text x="659.0" y="746" text-anchor="middle" font-size="14" fill="#1c2330">输出补丁 v1、工具记录与文件成果</text><text x="659.0" y="788" text-anchor="middle" font-size="12" fill="#626a73">成果注册并可预览；远端文件复制与本地注册分开</text><circle cx="941" cy="755" r="3" fill="#6b55c9"/></g><g class="event" data-event="8"><rect x="5" y="817" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="849" font-size="12" fill="#727c87">09</text><path d="M733 845 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="575.0" y="820" width="176.0" height="21" fill="white"/><text x="659.0" y="836" text-anchor="middle" font-size="14" fill="#1c2330">最终回复且引擎空闲后收尾</text><text x="659.0" y="878" text-anchor="middle" font-size="12" fill="#626a73">待权限应答仍算进行中；不能只看最后一段正文</text><circle cx="733" cy="845" r="3" fill="#6b55c9"/></g><g class="event" data-event="9"><rect x="5" y="907" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="939" font-size="12" fill="#727c87">10</text><path d="M109 935 H1149" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="547.0" y="910" width="232.0" height="21" fill="white"/><text x="659.0" y="926" text-anchor="middle" font-size="14" fill="#1c2330">人工衔接：把 v1 交给陈晓回归</text><text x="659.0" y="968" text-anchor="middle" font-size="12" fill="#626a73">当前原生团队指派、评论与独立验收闭环未核验</text><circle cx="109" cy="935" r="3" fill="#6b55c9"/></g><g class="event" data-event="10"><rect x="5" y="997" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="1029" font-size="12" fill="#727c87">11</text><path d="M1149 1025 H109" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="554.0" y="1000" width="218.0" height="21" fill="white"/><text x="659.0" y="1016" text-anchor="middle" font-size="14" fill="#1c2330">人工反馈：弱网仍重复，要求返工</text><text x="659.0" y="1058" text-anchor="middle" font-size="12" fill="#626a73">不是已证明存在的产品内通知或共享评论</text><circle cx="1149" cy="1025" r="3" fill="#6b55c9"/></g><g class="event" data-event="11"><rect x="5" y="1087" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="1119" font-size="12" fill="#727c87">12</text><path d="M109 1115 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="568.0" y="1090" width="190.0" height="21" fill="white"/><text x="659.0" y="1106" text-anchor="middle" font-size="14" fill="#1c2330">在当前任务追问并附测试差异</text><text x="659.0" y="1148" text-anchor="middle" font-size="12" fill="#626a73">消息通常再次进入主专家回合；排队在本轮真正结束后发送</text><circle cx="109" cy="1115" r="3" fill="#6b55c9"/></g><g class="event" data-event="12"><rect x="5" y="1177" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="1209" font-size="12" fill="#727c87">13</text><path d="M733 1205 H941" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="582.0" y="1180" width="162.0" height="21" fill="white"/><text x="659.0" y="1196" text-anchor="middle" font-size="14" fill="#1c2330">执行第二轮并生成 v2</text><text x="659.0" y="1238" text-anchor="middle" font-size="12" fill="#626a73">支持错误恢复与停止；不承诺撤销既有副作用</text><circle cx="733" cy="1205" r="3" fill="#6b55c9"/></g><g class="event" data-event="13"><rect x="5" y="1267" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="1299" font-size="12" fill="#727c87">14</text><path d="M941 1295 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="568.0" y="1270" width="190.0" height="21" fill="white"/><text x="659.0" y="1286" text-anchor="middle" font-size="14" fill="#1c2330">交付 v2 与新的执行记录</text><text x="659.0" y="1328" text-anchor="middle" font-size="12" fill="#626a73">消息、子代理、文件可在个人任务中查看</text><circle cx="941" cy="1295" r="3" fill="#6b55c9"/></g><g class="event" data-event="14"><rect x="5" y="1357" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="1389" font-size="12" fill="#727c87">15</text><path d="M109 1385 H1149" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="568.0" y="1360" width="190.0" height="21" fill="white"/><text x="659.0" y="1376" text-anchor="middle" font-size="14" fill="#1c2330">人工衔接：请陈晓复测 v2</text><text x="659.0" y="1418" text-anchor="middle" font-size="12" fill="#626a73">多人项目工作流属于文档 04 的建议</text><circle cx="109" cy="1385" r="3" fill="#6b55c9"/></g><g class="event" data-event="15"><rect x="5" y="1447" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="1479" font-size="12" fill="#727c87">16</text><path d="M1149 1475 H109" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="589.0" y="1450" width="148.0" height="21" fill="white"/><text x="659.0" y="1466" text-anchor="middle" font-size="14" fill="#1c2330">人工返回测试通过证据</text><text x="659.0" y="1508" text-anchor="middle" font-size="12" fill="#626a73">示例预期 1、实际 1</text><circle cx="1149" cy="1475" r="3" fill="#6b55c9"/></g><g class="event" data-event="16"><rect x="5" y="1537" width="1308" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="1569" font-size="12" fill="#727c87">17</text><path d="M109 1565 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="568.0" y="1540" width="190.0" height="21" fill="white"/><text x="659.0" y="1556" text-anchor="middle" font-size="14" fill="#1c2330">用户判断成果可用并整理任务</text><text x="659.0" y="1598" text-anchor="middle" font-size="12" fill="#626a73">当前未核验一等多人业务验收对象</text><circle cx="109" cy="1565" r="3" fill="#6b55c9"/></g><g class="event" data-event="17"><rect x="5" y="1627" width="1308" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="1659" font-size="12" fill="#727c87">18</text><path d="M109 1655 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="568.0" y="1630" width="190.0" height="21" fill="white"/><text x="659.0" y="1646" text-anchor="middle" font-size="14" fill="#1c2330">后续查历史、文件或删除任务</text><text x="659.0" y="1688" text-anchor="middle" font-size="12" fill="#626a73">删除任务不等于删除磁盘成果；知识中心当前强制隐藏</text><circle cx="109" cy="1655" r="3" fill="#6b55c9"/></g></svg>