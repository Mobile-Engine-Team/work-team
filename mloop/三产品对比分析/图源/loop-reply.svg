<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="875" viewBox="0 0 1110 875" style="font-family:PingFang SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563c9"/></marker></defs><text x="22" y="28" font-size="18" font-weight="600">Loop 微时序：回复、提及与加急</text><rect x="17" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="109" y="72" font-size="14" text-anchor="middle">成员</text><path d="M109 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="225" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="317" y="72" font-size="14" text-anchor="middle">会话 / Task</text><path d="M317 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="433" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="525" y="72" font-size="14" text-anchor="middle">投递判断</text><path d="M525 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="641" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="733" y="72" font-size="14" text-anchor="middle">Agent</text><path d="M733 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><rect x="849" y="45" width="185" height="42" rx="7" fill="#f1edfc" stroke="#d6cfee"/><text x="941" y="72" font-size="14" text-anchor="middle">通知</text><path d="M941 88 V850" stroke="#c6cbd1" stroke-dasharray="5 5"/><g class="event" data-event="0"><rect x="5" y="97" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="129" font-size="12" fill="#727c87">01</text><path d="M109 125 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478.0" y="100" width="162.0" height="21" fill="white"/><text x="555.0" y="116" text-anchor="middle" font-size="14" fill="#1c2330">从频道消息进入回复话题</text><text x="555.0" y="158" text-anchor="middle" font-size="12" fill="#626a73">话题承接局部上下文</text><circle cx="109" cy="125" r="3" fill="#6b55c9"/></g><g class="event" data-event="1"><rect x="5" y="187" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="219" font-size="12" fill="#727c87">02</text><path d="M109 215 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="513.0" y="190" width="92.0" height="21" fill="white"/><text x="555.0" y="206" text-anchor="middle" font-size="14" fill="#1c2330">提交普通消息</text><text x="555.0" y="248" text-anchor="middle" font-size="12" fill="#626a73">普通频道消息不默认群发所有 Agent</text><circle cx="109" cy="215" r="3" fill="#6b55c9"/></g><g class="event" data-event="2"><rect x="5" y="277" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="309" font-size="12" fill="#727c87">03</text><path d="M317 305 H525" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="387.0" y="280" width="344.0" height="21" fill="white"/><text x="555.0" y="296" text-anchor="middle" font-size="14" fill="#1c2330">若是任务讨论，检查 assignee 与显式提及</text><text x="555.0" y="338" text-anchor="middle" font-size="12" fill="#626a73">任务讨论唤醒 Agent assignee；提及增加接收者</text><circle cx="317" cy="305" r="3" fill="#6b55c9"/></g><g class="event" data-event="3"><rect x="5" y="367" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="399" font-size="12" fill="#727c87">04</text><path d="M525 395 H733" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="450.0" y="370" width="218.0" height="21" fill="white"/><text x="555.0" y="386" text-anchor="middle" font-size="14" fill="#1c2330">按共享、权限、成员偏好决定投递</text><text x="555.0" y="428" text-anchor="middle" font-size="12" fill="#626a73">Agent Team 按 leader/成员唤醒设置，不假定全员并行</text><circle cx="525" cy="395" r="3" fill="#6b55c9"/></g><g class="event" data-event="4"><rect x="5" y="457" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="489" font-size="12" fill="#727c87">05</text><path d="M525 485 H941" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="471.0" y="460" width="176.0" height="21" fill="white"/><text x="555.0" y="476" text-anchor="middle" font-size="14" fill="#1c2330">按人类订阅与通知策略提示</text><text x="555.0" y="518" text-anchor="middle" font-size="12" fill="#626a73">通知与执行不是同一个动作</text><circle cx="525" cy="485" r="3" fill="#6b55c9"/></g><g class="event" data-event="5"><rect x="5" y="547" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="579" font-size="12" fill="#727c87">06</text><path d="M109 575 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="506.0" y="550" width="106.0" height="21" fill="white"/><text x="555.0" y="566" text-anchor="middle" font-size="14" fill="#1c2330">运行中补充说明</text><text x="555.0" y="608" text-anchor="middle" font-size="12" fill="#626a73">普通发送不打断当前任务</text><circle cx="109" cy="575" r="3" fill="#6b55c9"/></g><g class="event" data-event="6"><rect x="5" y="637" width="1100" height="79" rx="5" fill="#f6f8fb" fill-opacity=".5"/><text x="14" y="669" font-size="12" fill="#727c87">07</text><path d="M109 665 H317" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="450.0" y="640" width="218.0" height="21" fill="white"/><text x="555.0" y="656" text-anchor="middle" font-size="14" fill="#1c2330">需要立刻转向时，对已发消息加急</text><text x="555.0" y="698" text-anchor="middle" font-size="12" fill="#626a73">不是再发一条普通消息；会打断并重递交同一可见消息</text><circle cx="109" cy="665" r="3" fill="#6b55c9"/></g><g class="event" data-event="7"><rect x="5" y="727" width="1100" height="79" rx="5" fill="#fff" fill-opacity=".5"/><text x="14" y="759" font-size="12" fill="#727c87">08</text><path d="M317 755 H733" fill="none" stroke="#2563c9" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="450.0" y="730" width="218.0" height="21" fill="white"/><text x="555.0" y="746" text-anchor="middle" font-size="14" fill="#1c2330">Agent 处理紧急输入并继续</text><text x="555.0" y="788" text-anchor="middle" font-size="12" fill="#626a73">停止已发生的文件/外部副作用仍需另行处理</text><circle cx="317" cy="755" r="3" fill="#6b55c9"/></g></svg>