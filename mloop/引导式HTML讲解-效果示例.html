<script id="lesson" type="application/json">{"title": "接收资料在入口，生成报告在执行端", "thesis": "先抓住两个不同的确认：「已接收」确认资料到达，「报告就绪」确认产出可用。中间由服务登记工作、执行器实际处理、台账保存进度。页面只负责提交与查询，不替执行器生成报告。把这几种责任分清楚，才能解释为什么上传成功之后，还需要等待、查询和处理失败。", "scope": "这是为演示讲解技能而设计的虚构系统，所有机制均为示例设定。没有读取真实产品源码，没有启动实际上传服务，也没有验证生产系统的重试、权限或持久化保证。", "case": "示例：小林提交编号 R-17 的月度资料，希望得到一份汇总报告。人物、编号、模块和状态仅用于串讲。", "insights": [{"title": "接收完成 ≠ 业务完成", "text": "上传成功只确认输入到达；报告就绪需要后续处理成功，两者的生命周期不同。"}, {"title": "状态记录 ≠ 通知消息", "text": "本例以记录台账为准；通知只提醒页面查询。真实产品是否如此，需要查实现。"}, {"title": "先沿一次动作看分工", "text": "不要先背模块清单。跟着 R-17 走一遍，再回来看哪个模块承担了哪一种责任。"}], "nodes": [{"id": "entry", "label": "提交页面", "role": "human", "what": "让小林选择资料、提交请求并查看结果。", "how": "把文件交给服务，拿到处理编号后查询同一编号的进度。", "boundary": "页面显示提交成功，不意味着报告已经生成。", "evidence": ["demo"], "x": 42, "y": 178, "w": 176, "h": 78, "sub": "提交资料 · 查询结果"}, {"id": "service", "label": "接收与登记服务", "role": "server", "what": "接收输入，把这次工作登记为可跟踪的记录。", "how": "为这份资料建立 R-17，并把需要处理的工作交给执行器。", "boundary": "本例未定义认证和持久化细节，不能据此判断真实服务的可靠性。", "evidence": ["demo"], "x": 312, "y": 66, "w": 330, "h": 76, "sub": "接收输入 · 建立关联"}, {"id": "records", "label": "处理台账", "role": "data", "what": "保存编号、当前处理状态以及结果位置。", "how": "服务写入待处理记录，执行完成后更新状态，页面按编号查询。", "boundary": "示例账本是状态变化的讲解记录，不是真实数据库或运行日志。", "evidence": ["demo"], "x": 312, "y": 444, "w": 330, "h": 74, "sub": "工作编号 · 当前状态 · 结果位置"}, {"id": "worker", "label": "报告执行器", "role": "edge", "what": "读取资料并生成汇总报告。", "how": "处理 R-17，完成后向服务交回结果位置与完成状态。", "boundary": "未设定自动重试与隔离机制；不能从‘执行器’这个名字推断这些能力。", "evidence": ["demo"], "x": 750, "y": 182, "w": 208, "h": 84, "sub": "读取资料 · 解析 · 汇总"}, {"id": "person", "label": "小林", "role": "human", "sub": "需要一份月度报告", "what": "发起工作，并判断产出是否可用。", "how": "提交资料后按 R-17 查看进度与结果。", "boundary": "接收成功不等于目标已经达成。", "x": 42, "y": 66, "w": 176, "h": 70, "evidence": ["demo"]}, {"id": "status", "label": "进度与结果视图", "role": "human", "sub": "待处理 · 处理中 · 报告就绪", "what": "把同一工作编号的状态与结果展示给提交人。", "how": "按编号查询台账，显示状态或下载入口。", "boundary": "本例不规定实时推送机制。", "x": 42, "y": 330, "w": 176, "h": 76, "evidence": ["demo"]}, {"id": "dispatch", "label": "工作登记与交接", "role": "server", "sub": "登记待办 · 关联输入 · 更新进度", "what": "把收到的输入变成可追踪的处理工作。", "how": "登记 R-17，把处理工作交给执行器。", "boundary": "未规定具体队列技术、并发策略与重试保证。", "x": 312, "y": 204, "w": 330, "h": 82, "evidence": ["demo"]}, {"id": "loader", "label": "输入准备", "role": "edge", "sub": "定位资料 · 准备读取", "what": "按工作编号找到本次处理的输入。", "how": "读取关联的资料位置，交给报告执行器解析。", "boundary": "能读取文件不代表内容一定可解析。", "x": 750, "y": 66, "w": 208, "h": 70, "evidence": ["demo"]}, {"id": "report", "label": "结果回交", "role": "edge", "sub": "成功交回结果 · 失败交回原因", "what": "把执行结果交还给负责记录状态的服务。", "how": "成功时交回报告位置，失败时交回原因。", "boundary": "网络重试与幂等策略未在本例定义。", "x": 750, "y": 330, "w": 208, "h": 76, "evidence": ["demo"]}], "edges": [{"from": "person", "to": "entry", "label": "提交", "path": "M130 136 L130 176", "lx": 150, "ly": 158, "role": "human"}, {"from": "entry", "to": "service", "label": "资料 / 请求", "path": "M218 216 C265 216 265 104 310 104", "lx": 259, "ly": 146, "role": "human"}, {"from": "service", "to": "dispatch", "label": "建立工作", "path": "M477 142 L477 202", "lx": 514, "ly": 177, "role": "server"}, {"from": "dispatch", "to": "records", "label": "写入状态", "path": "M477 286 L477 442", "lx": 515, "ly": 365, "role": "data"}, {"from": "dispatch", "to": "loader", "label": "交接 / R-17", "path": "M642 241 L693 241 L693 102 L748 102", "lx": 693, "ly": 156, "role": "server"}, {"from": "loader", "to": "worker", "label": "读取输入", "path": "M854 136 L854 180", "lx": 892, "ly": 160, "role": "edge"}, {"from": "worker", "to": "report", "label": "生成结果", "path": "M854 266 L854 328", "lx": 892, "ly": 299, "role": "edge"}, {"from": "report", "to": "dispatch", "label": "状态 / 结果位置", "path": "M750 368 C699 368 694 267 644 267", "lx": 695, "ly": 321, "role": "edge"}, {"from": "records", "to": "status", "label": "查询结果", "path": "M312 481 L266 481 L266 368 L220 368", "lx": 266, "ly": 427, "role": "server", "dash": true}, {"from": "status", "to": "entry", "label": "刷新显示", "path": "M130 <script>
'use strict';
const D=JSON.parse(document.getElementById('lesson').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const para=s=>`<p>${esc(s)}</p>`;
const editorial=s=>esc(s).replace(/「([^」]+)」/g,'<b>「$1」</b>');
const safeUrl=s=>/^(https?:\/\/)/i.test(s)?esc(s):'';
const sourceById=new Map(D.sources.map(s=>[s.id,s]));
const cite=ids=>ids.map(id=>{const s=sourceById.get(id);return `<a class="cite" href="#source-${esc(id)}"><span class="tag ${esc(s.kind)}">${esc(s.kind)}</span>${esc(s.label)}</a>`;}).join('');
const roleNames={human:'人 / 入口',server:'服务 / 协调',data:'数据 / 状态',edge:'执行 / 外部',agent:'Agent / 工具'};
const colors={human:'#6b55c9',server:'#2563c9',data:'#0d8a76',edge:'#d06a1c',agent:'#c03a68'};
const bgs={human:'#f1edfc',server:'#eaf1fd',data:'#e6f5f1',edge:'#fdf1e6',agent:'#fbeaf0'};
let sections=[];
const chapter=(id,name,body)=>{sections.push([id,name]);return `<section class="chapter" id="${id}" data-title="${esc(name)}"><div class="kicker">${String(sections.length-1).padStart(2,'0')} · ${{overview:'OVERVIEW',story:'ONE COMPLETE JOURNEY',modules:'RESPONSIBILITY & MECHANISM',compare:'IMPORTANT DISTINCTIONS',failures:'FAILURE & RECOVERY',quiz:'CHECK YOUR UNDERSTANDING',takeaways:'WHAT TO LOOK FOR',sources:'EVIDENCE & SCOPE'}[id]}</div>${body}</section>`;};
document.title=D.title;$('#brand').innerHTML=esc(D.shortTitle||'系统拆解')+'<small>交互式讲解</small>';
let html=chapter('overview','一页看懂整体',`<div class="hero"><h1>${esc(D.title)}</h1><p class="thesis">${editorial(D.thesis)}</p></div><div class="ctrl map-controls"><button class="btn pri" id="mapPlay">▶ 播放一次运行</button><button class="btn" id="mapStep">下一步</button><button class="btn" id="mapReset">重置</button><span class="caption" id="mapCaption">点任一模块看职责；或播放一遍完整流程。</span></div><div class="diagram" id="diagram"><svg id="map" role="group" aria-label="模块关系图"></svg></div><div class="map-note"><div id="rolekeys"></div><span>点击节点 · 逐步探索</span></div><aside class="panel" id="nodeinfo" aria-live="polite"></aside><div class="grid g3 insights">${D.insights.map((x,i)=>`<div class="card"><div class="kicker">洞察 ${i+1}</div><h4>${esc(x.title)}</h4>${para(x.text)}</div>`).join('')}</div><div class="callout reading-note"><b>阅读提示：</b>${esc(D.case)}</div>`);
html+=chapter('story',D.storyNav||'一个案例的完整旅程',`<div class="chapter-head"><h2>${esc(D.storyTitle||'从用户动作到系统变化，一步一步走完')}</h2><p class="lead">${esc(D.storyLead||'先看人做了什么，再看系统留下什么记录。始终跟着同一个案例，观察每一步如何交到下一个模块手里。')}</p></div><div class="scenes" id="scenes"></div><div class="ctrl"><button class="btn" id="prev">← 上一幕</button><button class="btn pri" id="next">下一幕 →</button><button class="btn" id="play">▶ 播放</button><button class="btn" id="reset">重置</button><span class="caption" id="stepcount"></span></div><div class="story"><div class="card scene" id="scene" aria-live="polite"></div><div class="card ledger"><div class="ledger-head"><h4>系统里留下的记录</h4><span>STATE LEDGER</span></div><div id="ledger"></div><div class="story-visual"><div class="label">此刻，哪些模块在参与</div><div class="diagram dim" id="storymap"></div></div></div></div><div class="why pathline" id="pathnote" aria-live="polite"></div>`);
html+=chapter('modules','核心模块为什么这样拆',`<div class="chapter-head"><h2>不是把功能分堆，而是把责任分清楚</h2><p class="lead">回到刚才的旅程：每一道边界都应该有理由。看输入从哪里来、输出交到哪里，再看为什么不能把两边简单合在一起。</p></div>${D.modules.map((m,i)=>`<article class="module-block"><div class="module-heading"><span class="index">${String(i+1).padStart(2,'0')}</span><h3>${esc(m.title)}</h3></div><div class="io-strip"><div><div class="label">输入 · 从上一步拿到</div>${para(m.input)}</div><span class="arrow">→</span><div><div class="label">输出 · 交给下一步</div>${para(m.output)}</div></div><div class="grid g3 trio"><div class="card"><h4>为什么这样设计</h4>${para(m.why)}</div><div class="card"><h4>真实怎么工作</h4>${para(m.how)}</div><div class="card"><h4>边界与代价</h4>${para(m.boundary)}</div></div><div class="module-meta"><b>接回主流程：</b>${esc(m.depends)}</div>${cite(m.evidence)}</article>`).join('')}`);
if(D.comparisons.length)html+=chapter('compare','最容易混淆的概念',`<h2>这些概念为什么要分开</h2><div class="tablewrap"><table><thead><tr><th>要区分什么</th><th>概念 A</th><th>概念 B</th><th>关键区别 / 关系</th></tr></thead><tbody>${D.comparisons.map(c=>`<tr><td>${esc(c.title)}</td><td>${esc(c.left)}</td><td>${esc(c.right)}</td><td>${esc(c.difference)}</td></tr>`).join('')}</tbody></table></div>`);
if(D.failures.length)html+=chapter('failures','出故障时谁来兜底',`<div class="chapter-head"><h2>正常路径之外，先问谁发现，再问谁恢复</h2><p class="lead">一次失败可能停在不同的位置。选择一种情况，沿着时间线看清恢复责任与剩下的边界。</p></div><div class="failure-grid"><div class="failure-options">${D.failures.map((f,i)=>`<button class="btn" data-failure="${i}">${esc(f.title)}</button>`).join('')}</div><div class="card failure-panel" id="failurePanel" aria-live="polite"></div></div>`);
if(D.quizzes.length)html+=chapter('quiz','先判断，再看解释',`<div class="chapter-head"><h2>如果真的理解了，你会怎样判断？</h2><p class="lead">先做一个选择，再回到前面的职责与状态变化找理由。</p></div><div class="grid g2">${D.quizzes.map((q,i)=>`<div class="card quiz"><div class="question-no">QUESTION ${String(i+1).padStart(2,'0')}</div><h4>${esc(q.question)}</h4>${q.options.map((o,j)=>`<button class="btn" data-quiz="${i}" data-option="${j}"><span style="font-family:var(--mono);opacity:.6;margin-right:8px">${String.fromCharCode(65+j)}</span>${esc(o)}</button>`).join('')}<div class="answer" id="answer-${i}" aria-live="polite">选择之后，看看你的判断依据是否成立。</div></div>`).join('')}</div>`);
html+=chapter('takeaways','带着这些问题继续看',`<h2>把这一套理解，带回真实系统</h2><p class="lead">不要只记模块的名字。下次遇到相似系统，带着这些问题去观察和追问。</p><div>${D.takeaways.map((x,i)=>`<div class="takeaway-row"><span>${String(i+1).padStart(2,'0')}</span><p>${esc(x)}</p></div>`).join('')}</div>`);
html+=chapter('sources','证据、范围与验证',`<h2>依据是什么，哪里还需要核验</h2><div class="sources-note"><div class="scope-label">本页解释到哪里 · 依据是什么</div>${esc(D.scope)}</div><div class="tablewrap"><table><thead><tr><th>类型</th><th>依据</th><th>适用范围 / 限制</th></tr></thead><tbody>${D.sources.map(s=>`<tr id="source-${esc(s.id)}" class="source"><td><span class="tag ${esc(s.kind)}">${esc(s.kind)}</span></td><td>${safeUrl(s.url)?`<a href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.label)}</a>`:esc(s.label)}</td><td>${esc(s.note)}</td></tr>`).join('')}</tbody></table></div><div class="foot">单文件 HTML · 无外部运行依赖 · 可以离线阅读与操作。外部证据链接需要网络。</div>`);
$('#main').innerHTML=html;
$('#toc').innerHTML='<div class="kicker">章节</div>'+sections.map(([id,t],i)=>`<a href="#${id}"><span>${String(i).padStart(2,'0')}</span>${esc(t)}</a>`).join('')+'<div class="legend"><div class="kicker">标注含义</div>'+[['源码','代码中直接可见'],['文档','资料明确说明'],['推断','由材料推导的判断'],['示例','讲解用虚构情节'],['建议','可供选择的做法']].map(([x,t])=>`<div class="legend-row"><span class="tag ${x}">${x}</span>${t}</div>`).join('')+'</div>';
const roles=Object.keys(roleNames).filter(r=>D.nodes.some(n=>n.role===r));
$('#rolekeys').innerHTML=roles.map(r=>`<span class="rolekey"><span class="dot" style="background:${colors[r]}"></span>${roleNames[r]}</span>`).join('');
const svg=$('#map'),ns='http://www.w3.org/2000/svg';
const el=(tag,attrs,text,parent=svg)=>{const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;parent.appendChild(e);return e;};
const bespoke=Boolean(D.diagram);
const maxRows=Math.max(...roles.map(r=>D.nodes.filter(n=>n.role===r).length));
const width=bespoke?D.diagram.width:roles.length*260+20,height=bespoke?D.diagram.height:Math.max(330,110+maxRows*142);
svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
const defs=el('defs',{});
Object.entries(colors).forEach(([r,c])=>{const m=el('marker',{id:'arrow-'+r,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},undefined,defs);el('path',{d:'M0 0 L10 5 L0 10z',fill:c},undefined,m);});
const positions=new Map();
if(bespoke){D.diagram.groups.forEach(g=>{el('rect',{x:g.x,y:g.y,width:g.w,height:g.h,rx:14,fill:bgs[g.role]});el('text',{x:g.x+14,y:g.y+22,fill:colors[g.role],'font-size':12,'font-weight':600,'letter-spacing':'.04em'},g.label);});D.nodes.forEach(n=>positions.set(n.id,{x:n.x,y:n.y,w:n.w,h:n.h}));}
else{roles.forEach((r,col)=>{const x=col*260+10;el('rect',{x,y:10,width:240,height:height-20,rx:14,fill:bgs[r]});el('text',{x:x+14,y:35,fill:colors[r],'font-size':12,'font-weight':600},roleNames[r]);D.nodes.filter(n=>n.role===r).forEach((n,row)=>positions.set(n.id,{x:x+18,y:68+row*142,w:204,h:88}));});}
D.edges.forEach((e,i)=>{const a=positions.get(e.from),b=positions.get(e.to),role=e.role||D.nodes.find(n=>n.id===e.from).role;const g=el('g',{class:'edge','data-from':e.from,'data-to':e.to});let path=e.path,lx=e.lx,ly=e.ly;
if(!path){if(a.x===b.x){const down=b.y>a.y;const x=a.x+a.w/2,sy=down?a.y+a.h:a.y,ty=down?b.y:b.y+b.h;path=`M${x},${sy} L${x},${ty}`;lx=x+12;ly=(sy+ty)/2;}
else{const forward=b.x>a.x,sx=a.x+(forward?a.w:0),tx=b.x+(forward?0:b.w),sy=a.y+a.h/2,ty=b.y+b.h/2,mx=(sx+tx)/2;path=`M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}`;lx=mx;ly=(sy+ty)/2-10;}}
const attrs={d:path,'marker-end':'url(#arrow-'+role+')',style:`stroke:${colors[role]}`};if(e.dash)attrs['stroke-dasharray']='6 5';if(e.both)attrs['marker-start']='url(#arrow-'+role+')';el('path',attrs,undefined,g);
const labels=e.label.split(' / ');labels.forEach((line,j)=>el('text',{x:lx,y:ly+j*14,'text-anchor':e.align||'middle','font-size':11.5,fill:colors[role],'font-weight':600,style:'paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round'},line,g));});
const nodeElements=new Map();
D.nodes.forEach(n=>{const p=positions.get(n.id),g=el('g',{class:'node',tabindex:0,role:'button','aria-label':n.label,'aria-pressed':'false'});const attrs={x:p.x,y:p.y,width:p.w,height:p.h,rx:10,fill:'#fff',stroke:colors[n.role]};if(n.dash)attrs['stroke-dasharray']='5 4';el('rect',attrs,undefined,g);const chunks=Array.from(n.label),lineLength=Math.max(8,Math.floor(p.w/16)),lineCount=Math.ceil(chunks.length/lineLength),cy=p.y+p.h/2-(n.sub?7:0)-(lineCount-1)*9;
for(let i=0;i<chunks.length;i+=lineLength)el('text',{x:p.x+p.w/2,y:cy+5+(i/lineLength)*18,'text-anchor':'middle','font-size':n.fs||14.5,'font-weight':650,fill:'#1c2330'},chunks.slice(i,i+lineLength).join(''),g);
if(n.sub)el('text',{x:p.x+p.w/2,y:cy+26+(lineCount-1)*18,'text-anchor':'middle','font-size':10.8,fill:'#7b8494'},n.sub,g);
nodeElements.set(n.id,g);g.addEventListener('click',()=>showNode(n));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showNode(n);}});});
let index=0,timer=null;
function stop(){if(timer!==null){clearInterval(timer);timer=null;}$('#play').textContent='▶ 播放';$('#play').setAttribute('aria-pressed','false');$('#mapPlay').textContent='▶ 播放一次运行';}
function clearMap(){nodeElements.forEach(g=>{g.classList.remove('selected','hot');g.setAttribute('aria-pressed','false');});svg.querySelectorAll('.edge').forEach(g=>g.classList.remove('hot'));$('#diagram').classList.remove('dim');}
function showNode(n){stop();clearMap();nodeElements.get(n.id).classList.add('selected');nodeElements.get(n.id).setAttribute('aria-pressed','true');$('#nodeinfo').innerHTML=`<div class="panel-head"><h4>${esc(n.label)}</h4><span>${esc(n.sub||roleNames[n.role])}</span></div><div class="pcols"><div><div class="label">负责什么</div>${para(n.what)}</div><div><div class="label">真实怎么工作</div>${para(n.how)}</div><div><div class="label">边界</div>${para(n.boundary)}</div><div><div class="label">依据</div>${cite(n.evidence)}</div></div>`;}
function showLegend(){clearMap();$('#nodeinfo').innerHTML=`<div class="panel-head"><h4>怎么读这张图：颜色表示责任地盘</h4><span>先看分工，再沿箭头走一遍</span></div><div class="pcols">${roles.filter(r=>r!=='agent').map(r=>`<div><div class="label" style="color:${colors[r]}">■ ${roleNames[r]}</div><p>${esc((D.roleDescriptions||{})[r]||D.nodes.filter(n=>n.role===r).map(n=>n.what).join(' '))}</p></div>`).join('')}</div>`;}
$('#scenes').innerHTML=D.steps.map((s,i)=>`<button class="btn" data-step="${i}" title="${esc(s.title)}">${i+1} · ${esc(s.title)}</button>`).join('');
function showStep(i){index=i;const s=D.steps[i];clearMap();$('#diagram').classList.add('dim');s.active.forEach(id=>nodeElements.get(id).classList.add('hot'));svg.querySelectorAll('.edge').forEach(g=>g.classList.toggle('hot',s.active.includes(g.dataset.from)&&s.active.includes(g.dataset.to)));$('#scene').innerHTML=`<span class="tag 示例">示例 · 第 ${i+1} / ${D.steps.length} 幕</span><h4>${esc(s.title)}</h4><div class="who">${esc(s.actor)}</div><div class="scene-row"><div class="label">用户看到</div>${para(s.visible)}</div><div class="scene-row"><div class="label">系统里发生</div>${para(s.system)}</div><div class="scene-row"><div class="label">依据</div>${cite(s.evidence)}</div>`;$('#ledger').innerHTML=D.steps.slice(0,i+1).map((s,j)=>s.changes.map(c=>`<div class="lrow ${j===i?'new':'old'}"><b>${String(j+1).padStart(2,'0')}</b><span>${esc(c)}</span></div>`).join('')).join('');$('#pathnote').textContent=`当前路径 · 第 ${i+1} 步：${s.active.map(id=>D.nodes.find(n=>n.id===id).label).join(' → ')}。${s.system}`;$('#mapCaption').textContent=`${i+1} / ${D.steps.length} · ${s.title}`;const miniature=svg.cloneNode(true);miniature.removeAttribute('id');miniature.querySelector('defs')?.remove();miniature.querySelectorAll('[tabindex]').forEach(n=>{n.removeAttribute('tabindex');n.removeAttribute('role');n.removeAttribute('aria-pressed');});miniature.setAttribute('aria-hidden','true');$('#storymap').replaceChildren(miniature);$('#stepcount').textContent=`${i+1} / ${D.steps.length}`;$('#prev').disabled=i===0;$('#next').disabled=i===D.steps.length-1;$('#scenes').querySelectorAll('button').forEach((b,j)=>{b.classList.toggle('on',i===j);b.setAttribute('aria-pressed',String(i===j));});$('#nodeinfo').innerHTML=`<h4>第 ${i+1} 步 · ${esc(s.title)}</h4>${para(s.system)}<p>亮起的模块：${esc(s.active.map(id=>D.nodes.find(n=>n.id===id).label).join(' → '))}</p>${cite(s.evidence)}`;}
$('#prev').onclick=()=>{stop();showStep(Math.max(0,index-1));};$('#next').onclick=()=>{stop();showStep(Math.min(D.steps.length-1,index+1));};$('#reset').onclick=()=>{stop();showStep(0);};$('#scenes').querySelectorAll('button').forEach(b=>b.onclick=()=>{stop();showStep(Number(b.dataset.step));});
$('#play').onclick=()=>{if(timer!==null){stop();return;}if(index===D.steps.length-1)showStep(0);$('#play').textContent='❚❚ 暂停';$('#play').setAttribute('aria-pressed','true');$('#mapPlay').textContent='❚❚ 暂停播放';timer=setInterval(()=>{if(index>=D.steps.length-1){stop();return;}showStep(index+1);if(index===D.steps.length-1)stop();},2600);};
$('#mapPlay').onclick=()=>$('#play').click();$('#mapStep').onclick=()=>{stop();showStep(index>=D.steps.length-1?0:index+1);};$('#mapReset').onclick=()=>{stop();showStep(0);showLegend();$('#mapCaption').textContent='点任一模块看职责；或播放一遍完整流程。';};
function showFailure(i){const f=D.failures[i];$('#failurePanel').innerHTML=`<h4>${esc(f.title)}</h4><div class="timeline"><p><b>01 · 触发</b>${esc(f.trigger)}</p><p><b>02 · 检测</b>${esc(f.detect)}</p><p><b>03 · 恢复</b>${esc(f.recover)}</p></div><div class="limit"><b>边界：</b>${esc(f.limit)}</div>${cite(f.evidence)}`;document.querySelectorAll('[data-failure]').forEach((b,j)=>{b.classList.toggle('on',j===i);b.setAttribute('aria-pressed',String(j===i));});}document.querySelectorAll('[data-failure]').forEach(b=>b.onclick=()=>showFailure(Number(b.dataset.failure)));if(D.failures.length)showFailure(0);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.quiz),j=Number(b.dataset.option),q=D.quizzes[i];b.closest('.quiz').querySelectorAll('button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',String(x===b));});$(`#answer-${i}`).textContent=(j===q.answer?'答对了。':'再想一想。正确答案是：'+q.options[q.answer]+'。')+q.explanation;});
const closeMenu=()=>{$('#toc').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');};$('#menu').onclick=()=>{$('#menu').setAttribute('aria-expanded',String($('#toc').classList.toggle('open')));};$('#toc').querySelectorAll('a').forEach(a=>a.onclick=closeMenu);document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();$('#menu').focus();}});
function scrollState(){let cur=sections[0];sections.forEach(s=>{if(document.getElementById(s[0]).getBoundingClientRect().top<=110)cur=s;});$('#toc').querySelectorAll('a').forEach(a=>{const on=a.hash==='#'+cur[0];a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});$('#current').textContent=cur[1];const h=document.documentElement.scrollHeight-innerHeight;$('#progress').style.width=(h>0?Math.min(100,scrollY/h*100):0)+'%';}
addEventListener('scroll',scrollState,{passive:true});addEventListener('resize',scrollState);showStep(0);showLegend();scrollState();
</script></body></html>
