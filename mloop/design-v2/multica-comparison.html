<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multica 页面截图对照 · MobileWork v2</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f7;color:#18181b;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1540px;padding:28px 28px 40px;margin:auto}header{display:flex;align-items:center;gap:20px;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}h1{font-size:22px;line-height:30px;margin:0}p{margin:4px 0 0;color:#71717a;font-size:13px}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}select,a,button{font:inherit;color:inherit;border:1px solid #e0e0e5;background:white;padding:6px 12px;border-radius:6px;text-decoration:none;cursor:pointer}.stage{position:relative;width:100%;aspect-ratio:1470/841;border:1px solid #ddd;border-radius:12px;overflow:hidden;background:white;--split:50%}.stage img{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.stage #rendered{clip-path:inset(0 calc(100% - var(--split)) 0 0)}.divider{position:absolute;left:var(--split);inset-block:0;width:2px;background:#087aff;box-shadow:0 0 4px #fff;pointer-events:none}.divider:after{content:'↔';position:absolute;left:-17px;top:50%;width:36px;height:36px;border-radius:50%;background:#fff;color:#087aff;text-align:center;line-height:34px;border:1px solid #087aff;font-size:20px}.badges{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.badges span{padding:4px 10px;background:#fffE;border:1px solid #ddd;border-radius:20px;font-size:12px;color:#555}.range{display:flex;align-items:center;gap:14px;margin-top:20px;color:#71717a;font-size:13px}.range input{flex:1;accent-color:#087aff;cursor:ew-resize}footer{margin-top:12px;display:flex;gap:12px;flex-wrap:wrap}footer button{font-size:12px;padding:4px 10px}.stage[data-mode="reference"] #rendered{clip-path:inset(0 100% 0 0)}.stage[data-mode="rendered"] #rendered{clip-path:none}.stage:not([data-mode="split"]) .divider,.stage:not([data-mode="split"]) .badges{display:none}
</style></head><body><main><header><div><h1>Multica 页面截图对照</h1><p>六张参考图与 1470 × 841 浏览器实际渲染图。拖动滑块查看同一位置的还原效果。</p></div><div class="actions"><select id="page" aria-label="选择对照页面"></select><a id="live" href="inbox.html">打开 Work 内嵌页 ↗</a><a id="native" href="inbox.html?frame=multica">原窗口预览 ↗</a><a href="overview.html">全部页面</a></div></header><div class="stage" id="stage" data-mode="split"><img id="reference" alt="用户提供的 Multica 参考截图"><img id="rendered" alt="静态页面在浏览器中的实际渲染"><div class="divider"></div><div class="badges"><span>左侧 · 页面还原</span><span>右侧 · 原始截图</span></div></div><div class="range"><span>原图</span><input type="range" id="split" min="0" max="100" value="50" aria-label="对照分割位置"><span>还原图</span></div><footer><button data-mode="reference">仅看原图</button><button data-mode="rendered">仅看还原图</button><button data-mode="split">滑动对照</button></footer></main><script>
const entries=[['inbox','收件箱 · 任务动态'],['work','工作 · 项目看板']];const picker=document.querySelector('#page'),stage=document.querySelector('#stage'),slider=document.querySelector('#split');for(const [id,title]of entries){const option=document.createElement('option');option.value=id;option.textContent=title;picker.append(option)}function update(){const id=picker.value;document.querySelector('#reference').src='assets/multica/reference-'+id+'.png';document.querySelector('#rendered').src='previews/multica-'+id+'.png';document.querySelector('#live').href=id+'.html';document.querySelector('#native').href=id+'.html?frame=multica'}picker.addEventListener('change',update);slider.addEventListener('input',()=>{stage.dataset.mode='split';stage.style.setProperty('--split',slider.value+'%')});document.querySelectorAll('button[data-mode]').forEach(button=>button.addEventListener('click',()=>stage.dataset.mode=button.dataset.mode));update();
</script></body></html>
