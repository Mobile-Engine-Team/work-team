let s;try{s=JSON.parse(localStorage.getItem(K))||init()}catch{s=init()}let a=Number(sessionStorage.getItem(K+'-role')||0),page='团队首页';const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(K,JSON.stringify(s));const log=t=>s.activity.unshift({who:roles[a],t,at:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});const btn=(t,act,pri=false,off=false)=>'<button data-act="'+act+'" class="'+(pri?'pri':'')+'" '+(off?'disabled':'')+'>'+E(t)+'</button>', box=(t,c)=>'<section><h2>'+E(t)+'</h2>'+c+'</section>',field=(label,id,value)=>'<label>'+label+'<br><input id="'+id+'" value="'+E(value)+'"></label>',msg=(who,t)=>{s.chat.push({who,t})},val=id=>($(id)?.value||'').trim(),jump=p=>{page=p;render()},allowed=()=>s.people.includes(a),pname=()=>s.project?.name||'待立项';
const runtimeModels={'研发机 A':['DeepSeek Flash'],'共享构建机':['Codex 默认模型']};
const rtOptions=key=>runtimeModels[key].map(m=>'<option>'+E(m)+'</option>').join('');
const defaultTitles=['修复重复写入','独立回归','发布验收'];
const stages=['待发布','待研发接手','补丁助手排队','补丁助手运行中','等待独立回归','首轮失败 · 待返工','修订版待复验','等待负责人验收','已结项'];
function destination(){if(!s.ws||!allowed())return '团队首页';if(s.people.length<3||!s.agent)return '成员与智能体';if(!s.project)return '团队聊天';if(!s.project.invited||s.stage===0||s.stage>=7)return '项目';return '我的待办'}
function guide(){if(!s.ws)return '以王蕾身份创建工作区，这是新团队的第一个动作。';if(!allowed())return s.invite.includes(a)?'你收到工作区邀请，接受后才能使用团队资源。':'你尚未获邀，请切换到王蕾邀请成员。';if(s.people.length<3)return '去「成员与智能体」邀请研发和测试，再切到各自视角接受。';if(!s.agent)return '切到周启明，在「成员与智能体」配置自己的修复助手。';if(!s.chat.some(x=>x.brain))return '在「团队聊天」发起讨论，让同事和助手从不同角度提出假设。';if(!s.project)return '在「团队聊天」把讨论转为项目，背景和验收条件随讨论带过去。';if(!s.project.invited)return '在「项目」把研发和测试加入项目，确认分工。';return ['负责人发布分工，研发和测试将在各自的待办中收到事项。','切换周启明，在「我的待办」接手研发事项。','周启明在研发事项中查看队列并启动执行。','周启明收取补丁与自测结果，交给陈晓独立验证。','切换陈晓，用独立回归检查当前补丁。','周启明从退回的同一事项查看失败证据，提交修订。','陈晓用原来的失败样例复验修订。','王蕾查看两轮回归和产物后验收结项。','项目已收尾；在项目内可回看聊天决策、两轮补丁、回归与签字。'][s.stage]}
function home(){if(!s.ws)return box('创建第一个工作区',field('工作区名称','name','移动研发组')+btn('创建工作区','createWs',true,a!==0));if(!allowed())return box('工作区邀请',s.invite.includes(a)?'<p>王蕾邀请你加入「'+E(s.ws)+'」，以你自己的演示身份加入。</p>'+btn('接受邀请','join',true):'尚无邀请');return box('团队概况','<div class="grid">'+[[s.people.length,'已加入的成员'],[s.agent?1:0,'团队智能体'],[s.project?1:0,'研发项目'],[s.project?stages[s.stage]:'—','当前进展']].map(x=>'<div class="tile"><strong>'+E(x[0])+'</strong>'+x[1]+'</div>').join('')+'</div>')+box('最近进展',activity())}
function activity(){return s.activity.slice(0,30).map(x=>'<div class="log"><b>'+E(x.who)+'</b>　'+E(x.t)+'　<small>'+E(x.at||'')+'</small>'+'</div>').join('')||'还没有项目活动'}
function members(){let h=box('工作区成员',roles.map((n,i)=>'<div class="log">'+E(n)+' · '+job[i]+'　<span class="chip">'+(s.people.includes(i)?'已加入':s.invite.includes(i)?'待接受':'未邀请')+'</span> '+(a===0&&!s.people.includes(i)&&!s.invite.includes(i)?btn('邀请'+n,'invite'+i):'')+'</div>').join(''));if(s.agent)h+=box('团队智能体','<b>'+E(s.agent.name)+'</b> · 周启明创建<p>'+E([s.agent.rt,s.agent.model,s.agent.skill].join(' / '))+'</p>');else if(a===1)h+=box('配置我的智能体',field('名称','agent','修复助手')+'<label>团队执行端 <select id="rt"><option>研发机 A</option><option>共享构建机</option></select></label><label>已授权模型 <select id="model">'+rtOptions('研发机 A')+'</select></label><label>绑定团队 Skill <select id="skill"><option>缺陷修复与自测</option><option>重试路径检查</option></select></label>'+btn('保存智能体','agent',true));return h}
function chat(){return box('研发讨论',s.chat.map(x=>'<div class="log"><b>'+E(x.who)+'</b><p>'+E(x.t)+'</p></div>').join('')||'还没有讨论。')+box('发消息', '<textarea id="message" aria-label="讨论内容">'+(!s.chat.some(x=>x.brain)?'移动端在弱网下重试提交，偶尔出现两条待办。怎么复现？修复后怎样证明问题消失？':'')+'</textarea>'+btn('发送','chat',true))+((s.chat.some(x=>x.brain)&&!s.project&&a===0)?box('从讨论立项',field('项目名称','project','弱网重复待办修复')+btn('将讨论转为项目','project',true)):(s.project?btn('查看关联项目','goProject'):''))}
function evidence(){return s.evidence.map(x=>'<div class="log"><b>'+E(x.name)+'</b><p>'+E(x.text)+'</p></div>').join('')||'执行后，补丁与报告将保存在这里。'}
function tasks(){let t=s.stage;return '<div class="grid">'+[['修复重复写入','周启明 + '+(s.agent?.name||'修复助手'),t===5?'被退回':t>=4?'补丁已提交':t>=2?'进行中':'待接手'],['独立回归','陈晓',t>=7?'通过':t===5?'发现缺陷':t>=4?'待验证':'等候补丁'],['发布验收','王蕾',t===8?'已签字':t===7?'待验收':'等待回归']].map(x=>'<div class="tile"><b>'+E(s.project?.titles?.[['修复重复写入','独立回归','发布验收'].indexOf(x[0])]||x[0])+'</b><p>'+E(x[1])+'</p><span class="chip">'+E(x[2])+'</span></div>').join('')+'</div>'}
function project(){if(!s.project)return box('项目','暂无项目。确定方向后可以直接从团队讨论立项。 '+btn('打开团队聊天','goChat'));let p=s.project;return box(p.name,'<span class="chip">'+stages[s.stage]+'</span>　'+(s.stage>0&&s.stage<7?btn('查看当前事项','goMine'):'')+'<p><b>立项依据</b>　'+E(p.source)+'</p><p><b>验收条件</b>　同一请求超时重放只生成一条待办；不同请求仍各生成一条。由测试独立验证。</p>'+'<details><summary>立项时的讨论记录</summary>'+p.discussion.map(m=>'<p>'+E(m)+'</p>').join('')+'</details>'+btn('查看原讨论','goChat')+'<p><b>项目成员</b>　'+(p.invited?'王蕾、周启明、陈晓':'王蕾')+'</p>'+(!p.invited&&a===0?btn('将周启明、陈晓加入项目','staff',true):''))+
box('项目看板',s.stage===0?(p.invited&&a===0?'按下列分工发布后，两位同事会收到各自的事项。'+defaultTitles.map((t,i)=>field(['研发事项 · 周启明','测试事项 · 陈晓','验收事项 · 王蕾'][i],'task'+i,t)).join('')+btn('发布三项分工','publish',true):'等待负责人发布任务。'):tasks())+box('项目证据',evidence())+(s.stage===7&&a===0?box('项目验收',field('验收备注','sign','独立复验通过；同请求去重，不影响不同请求。')+btn('验收并结项','close',true)):'')+(s.stage===8?box('结项记录','王蕾验收：'+E(p.sign)):'')+box('项目动态',activity())}
const owner=[0,1,1,1,2,1,2,0,0],cmd=['','接手并委派给修复助手','启动执行','提交首版补丁','运行首轮独立回归','提交修订补丁','复验修订版','查看证据并验收',''];
function mine(){if(!s.project||s.stage<1)return box('我的待办','项目尚未发布任务。');if(s.stage===8)return box('我的待办','没有需要你处理的事项。 '+btn('查看结项记录','goProject'));let t=s.stage;return box('当前由谁处理','<b>'+E(pname())+'</b>　<span class="chip">'+stages[t]+'</span><p>'+guide()+'</p>'+(owner[t]===a?btn(cmd[t],t===7?'goProject':'advance',true,t===2&&!s.online):'当前负责人：'+roles[owner[t]])+(t===2&&!s.online?'<p>执行端离线。恢复后可从本事项继续启动。</p>':''))+box('分工与状态',tasks())+box('关联的补丁与报告',evidence())}
function personal(){let n=(s.notes||{})[a]||'';return box('我的调查笔记','<p>仅当前成员可见。只把需要同事协助的问题发到团队，整份笔记保留在个人侧。</p><textarea id="privateNote" aria-label="私人笔记">'+E(n)+'</textarea>'+btn('保存私人笔记','saveNote'))+box('请团队一起讨论',field('仅分享以下问题','question','服务端写入成功后断网，移动端重试为何生成重复待办？')+btn('分享问题到团队聊天','shareNote',true))}
function ops(){return box('研发发布小队',s.squad?'<p>小队成员：'+E(roles.filter((_,i)=>s.squad.includes(i)).join('、'))+'</p>':('<p>将工作区中的负责人、研发和测试组成常用协作小队。</p>'+btn('创建研发发布小队','squad',false,a!==0||s.people.length<3)))+box('团队自动化 · 项目进展播报','<p>把当前项目、状态和下一位处理人发回团队频道，团队在讨论处就能查进展。</p><p>当前：'+(s.auto?'已启用':'未启用')+'</p>'+btn(s.auto?'停用自动播报':'启用状态变更播报','auto',false,a!==0)+' '+btn('立即发一份进展','digest',false,a!==0||!s.project)+' '+btn('去聊天查看','goChat'))}
function digest(){if(!s.project)return;msg('项目进展播报',pname()+'：'+stages[s.stage]+'。'+(s.stage===8?'项目已签字收尾。':'当前负责：'+roles[owner[s.stage]]+'。'))}
function runtime(){return box('团队执行端',(s.agent?.rt||'研发机 A')+'　<span class="chip">'+(s.online?'在线':'离线')+'</span><p>运行修复助手，读取研发工作副本。已授权模型：'+E((runtimeModels[s.agent?.rt||'研发机 A']||[]).join('、'))+'。</p>'+btn(s.online?'模拟断开':'恢复在线','toggle'))+box('独立测试机 B','陈晓维护 · 在线<p>在独立工作副本复验研发提交的补丁，报告保存在原项目。</p>')}
function render(){let active=allowed()&&s.ws; $('actor').innerHTML=roles.map((x,i)=>'<option value="'+i+'" '+(i===a?'selected':'')+'>'+x+' · '+job[i]+'</option>').join('');$('ws').textContent=s.ws||'团队协作';$('menu').innerHTML=pages.map(p=>'<button data-nav="'+p+'" class="'+(p===page?'sel':'')+'" '+(!active&&p!=='团队首页'?'disabled':'')+'>'+p+'</button>').join('');if(!active)page='团队首页';$('panel').innerHTML='<small>团队协作　/　'+E(s.ws||'首次使用')+'</small><h1>'+page+'</h1><div class="hint"><b>本场景提示</b>　'+E(guide())+(active&&destination()!==page?'　<button data-nav="'+destination()+'">打开'+destination()+'</button>':'')+'</div>'+({'团队首页':home,'个人任务':personal,'小队与自动化':ops,'成员与智能体':members,'团队聊天':chat,'项目':project,'我的待办':mine,'执行端':runtime}[page])()}
const proofs={3:['patch-v1.diff','服务端按请求标识查重。研发自测通过；交给陈晓验证超时重放。'],4:['regression-v1.txt · 未通过','响应丢失后，客户端重试时生成了新标识。期望 1 条，实得 2 条。退回原研发事项。'],5:['patch-v2.diff','复用首次提交的请求标识；补上服务端唯一约束。保留首版补丁与失败报告。'],6:['regression-v2.txt · 通过','同请求重放 3 次只生成 1 条；两个不同请求生成 2 条。独立测试机 B 复验通过。']};
document.addEventListener('change',e=>{if(e.target.id==='rt'&&$('model'))$('model').innerHTML=rtOptions(e.target.value)});
document.onclick=e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav)return jump(b.dataset.nav);let k=b.dataset.act;if(!k)return;let note='';switch(k){
case 'saveNote':s.notes=s.notes||{};s.notes[a]=val('privateNote');note='私人笔记已保存。';break;
case 'shareNote':if(!val('question'))return;msg(roles[a],val('question'));log('只分享了选定问题到团队聊天');page='团队聊天';break;
case 'squad':s.squad=[...s.people];log('创建研发发布小队');break;
case 'auto':s.auto=!s.auto;log(s.auto?'启用项目进展播报':'停用项目进展播报');break;
case 'digest':digest();page='团队聊天';break;
case 'createWs':if(!val('name'))return;$('notice').textContent='';s.ws=val('name');s.people=[0];log('创建工作区 '+s.ws);page='成员与智能体';break;
case 'invite1':case 'invite2':{let i=Number(k.slice(-1));s.invite.push(i);log('向'+roles[i]+'发出工作区邀请');break}
case 'join':s.people.push(a);s.invite=s.invite.filter(i=>i!==a);log('接受邀请并加入工作区');break;
case 'agent':if(!val('agent')||!runtimeModels[val('rt')]?.includes(val('model')))return;s.agent={name:val('agent'),rt:val('rt'),model:val('model'),skill:val('skill')};log('配置 '+s.agent.name);break;
case 'chat':{let t=val('message');if(!t)return;msg(roles[a],t);if(s.agent&&s.people.length===3&&!s.chat.some(x=>x.brain)){s.chat.at(-1).brain=true;msg('陈晓 · 示例回复','先模拟服务端已保存、响应丢失，再让客户端重试。验收时要数实际生成了几条待办。');msg(s.agent.name+' · 示例回复','建议同时检查客户端请求标识复用和服务端去重；还要验证两次不同提交不会被误合并。')}break}
case 'project':if(!val('project'))return;s.project={name:val('project'),source:s.chat.find(x=>x.brain).t,discussion:s.chat.map(x=>x.who+'：'+x.t),invited:false};msg('项目动态','讨论已关联到「'+s.project.name+'」。');log('依据讨论新建 '+pname());page='项目';break;
case 'staff':s.project.invited=true;log('将研发和测试加入项目');break;
case 'publish':{const titles=defaultTitles.map((_,i)=>val('task'+i));if(titles.some(t=>!t))return;s.project.titles=titles;}s.stage=1;log('发布修复、独立回归和发布验收三项分工');break;
case 'advance':{let t=s.stage;if(owner[t]!==a||t===2&&!s.online)return;if(proofs[t])s.evidence.push({name:proofs[t][0],text:proofs[t][1]});s.stage++;log(cmd[t]+'：'+stages[s.stage]);break}
case 'close':if(!val('sign')||s.stage!==7||a!==0)return;s.project.sign=val('sign');s.stage=8;log('验收通过并结项');msg('项目动态',pname()+' 已结项，验收人王蕾。');break;
case 'toggle':s.online=!s.online;break;
case 'goMine':return jump('我的待办');case 'goProject':return jump('项目');case 'goChat':return jump('团队聊天');default:return}
if(s.auto&&['publish','advance','close'].includes(k))digest();$('notice').textContent=note;save();render()};$('actor').onchange=e=>{a=+e.target.value;sessionStorage.setItem(K+'-role',a);page=allowed()&&s.stage>0?'我的待办':'团队首页';render()};function returnToStart() {
  a = 0;
  page = '团队首页';
  sessionStorage.removeItem(K + '-role');
  $('notice').textContent = '';
  render();
  window.scrollTo(0, 0);
}
$('reset').onclick = () => {
  if (!confirm('重置此次演练？工作区、成员、聊天、项目和执行记录都将清空。')) return;
  s = init();
  save();
  returnToStart();
};
window.addEventListener('storage', event => {
  if (event.key !== K || !event.newValue) return;
  s = JSON.parse(event.newValue);
  if (!s.ws) returnToStart();
  else render();
});
render();
</script></html>
