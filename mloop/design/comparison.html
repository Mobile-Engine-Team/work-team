<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务页截图对照 · MobileWork</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#24292f;background:#f3f5f8}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;background:white;border-bottom:1px solid #e5e9ef}h1{font-size:18px;margin:0}p{margin:4px 0 0;color:#7c8085;font-size:12px}.tools{display:flex;gap:12px;align-items:center}button,a{border:1px solid #dce1e7;border-radius:6px;background:white;padding:7px 12px;color:inherit;text-decoration:none;cursor:pointer;font:inherit}button.active{color:#1890ff;background:#e6f4ff;border-color:#1890ff}main{padding:20px}.comparison{position:relative;width:100%;aspect-ratio:1960/1103;overflow:hidden;border:1px solid #dce1e7;border-radius:16px;background:white}.comparison>img{display:block;position:absolute;inset:0;width:100%;height:100%}.comparison .output{clip-path:inset(0 0 0 50%)}.divider{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#1890ff;pointer-events:none}.divider:before{content:"↔";position:absolute;top:50%;transform:translate(-50%,-50%);background:white;border:1px solid #1890ff;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;color:#1890ff}.slider{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:ew-resize}.labels{display:flex;justify-content:space-between;color:#7c8085;font-size:12px;padding:8px 4px}.note{max-width:900px;margin:12px 0;color:#7c8085;font-size:12px}
</style></head><body><header><div><h1>任务页截图对照</h1><p>统一到 1960 × 1103 的窗口尺寸；拖动分界线比较相同位置。</p></div><div class="tools"><button data-mode="reference">原图</button><button data-mode="split" class="active">拖动对照</button><button data-mode="output">当前效果</button><a href="task.html">打开 HTML 页面 →</a></div></header><main><div class="comparison"><img src="previews/reference-calibration.png" alt="用户提供的原应用截图"><img class="output" src="previews/task-calibrated.png" alt="当前 HTML 实际浏览器渲染"><div class="divider"></div><input class="slider" aria-label="截图对照分界位置" type="range" min="0" max="100" value="50"></div><div class="labels"><span>原应用截图</span><span>当前 HTML 浏览器渲染</span></div><p class="note">此对照验证用户截图对应的任务页与共用侧栏。滚动条长度受静态对话长度影响，字体边缘也会受截图缩放与渲染环境影响；其余页面按源码核对，未逐页与实机截图比对。</p></main><script>
const output=document.querySelector('.output'),divider=document.querySelector('.divider'),slider=document.querySelector('.slider');
function render(value){output.style.clipPath='inset(0 0 0 '+value+'%)';divider.style.left=value+'%'}
slider.addEventListener('input',()=>render(slider.value));
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===button));const mode=button.dataset.mode;slider.value=mode==='reference'?100:mode==='output'?0:50;divider.style.display=mode==='split'?'block':'none';render(slider.value)}));
</script></body></html>
