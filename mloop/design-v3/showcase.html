<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>MobileWork · 协作场景</title><body style="font:14px system-ui;color:#71809a;display:grid;place-items:center;height:90vh"><p>正在打开产品协作场景…</p><script>
(async()=>{const d=await (await fetch('demo/presentation-data.json')).json();const id=d.team.id;const suffix='::team:'+id;const marker='mw-showcase-version'+suffix;let teams=JSON.parse(localStorage.getItem('mw-team-directory-v1')||'null')||[{id:'product',name:'产品研发团队',initial:'研',description:'产品设计与研发协作',role:'所有者',color:'blue'},{id:'brand',name:'品牌运营团队',initial:'营',description:'内容策划与品牌运营',role:'成员',color:'violet'}];if(!teams.some(t=>t.id===id)){teams.push(d.team);localStorage.setItem('mw-team-directory-v1',JSON.stringify(teams))}if(!localStorage.getItem(marker)){localStorage.setItem('mw-multica-workspace-v4'+suffix,JSON.stringify(d.workspace));const prefix='mw-live-conversations'+suffix+':';for(const c of d.conversations){localStorage.setItem(prefix+'meta:'+c.id,JSON.stringify({...c,messages:[]}));for(const m of c.messages)localStorage.setItem(prefix+'message:'+c.id+':'+m.id,JSON.stringify(m))}localStorage.setItem(prefix+'migrated','1');localStorage.setItem(marker,'1')}const runMarker='mw-showcase-execution-v1'+suffix;if(!localStorage.getItem(runMarker)){const prefix='mw-live-conversations'+suffix+':';for(const c of d.conversations)for(const m of c.messages){const k=prefix+'message:'+c.id+':'+m.id;const old=JSON.parse(localStorage.getItem(k)||'null');if(old&&m.execution)localStorage.setItem(k,JSON.stringify({...old,execution:m.execution}))}localStorage.setItem(runMarker,'1')}sessionStorage.setItem('mw-local-identity','肖叶茂');location.replace('index.html?team='+id+'&conversation=showcase-cursor')})().catch(()=>document.querySelector('p').textContent='请通过本地 HTTP 服务打开此页面。');
</script></body></html>
