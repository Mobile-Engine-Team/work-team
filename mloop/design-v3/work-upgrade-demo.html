<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work 升级 · 全流程演示</title><style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f8fd;color:#20314a;font:14px/1.8 system-ui}main{max-width:720px;padding:48px;background:white;border:1px solid #e5ebf4;border-radius:24px;box-shadow:0 20px 80px #233c6010}small{color:#5185c7}h1{font-size:30px;line-height:1.5;margin:12px 0}p{color:#718096}ol{padding-left:22px;color:#526178}button,a{font:inherit}button{padding:12px 24px;border:0;border-radius:9px;background:#2488ff;color:white;cursor:pointer}a{display:inline-block;margin-left:20px;color:#4f7daf;text-decoration:none}footer{font-size:12px;margin-top:24px;color:#8a96a7}</style><main><small>WORK · 一次完整的团队协作</small><h1>从升级想法，到可验收的 Demo</h1><p>肖叶茂发起 Work 软件升级，邀请产品、研发与负责人共同确认目标，创建研究助手，再把讨论落实成任务。</p><ol><li>组建协作空间：邀请同事、接受邀请、创建智能体。</li><li>对齐目标：与 Work 初步讨论，再与同事确认范围。</li><li>推进交付：创建任务、在任务下协作、沉淀调研结论。</li><li>领导查看进展，Work 提前发现兼容性风险，再跟进复查。</li></ol><button id="start">开始一轮新演示</button><a id="resume" hidden>继续上次演示</a><footer>前端本地演示，约 5–8 分钟。创建独立空间，保留原有数据；同事与领导通过演示角色切换参与，不发送外部邮件。</footer><p id="error" role="alert"></p></main><script>
const previous=localStorage.getItem('mw-upgrade-demo-latest');if(previous){const a=document.querySelector('#resume');a.hidden=false;a.href='index.html?team='+encodeURIComponent(previous)}
document.querySelector('#start').onclick=()=>{try{const id='upgrade-demo-'+Date.now(),suffix='::team:'+id;const teams=JSON.parse(localStorage.getItem('mw-team-directory-v1')||'null')||[{id:'product',name:'产品研发团队',initial:'研',description:'产品设计与研发协作',role:'所有者',color:'blue'},{id:'brand',name:'品牌运营团队',initial:'营',description:'内容策划与品牌运营',role:'成员',color:'violet'}];teams.push({id,name:'Work 升级专项',initial:'W',description:'软件升级调研与可交互 Demo 搭建',role:'所有者',color:'blue',created:new Date().toISOString()});localStorage.setItem('mw-team-directory-v1',JSON.stringify(teams));localStorage.setItem('mw-expert-agents-v1'+suffix,JSON.stringify({agents:[],squads:[],members:[{id:'me',name:'肖叶茂',email:'xiaoyemao@example.com',role:'所有者'}],tasks:[]}));localStorage.setItem('mw-upgrade-walkthrough'+suffix,JSON.stringify({step:0,startedAt:new Date().toISOString()}));localStorage.setItem('mw-upgrade-demo-latest',id);sessionStorage.setItem('mw-local-identity','肖叶茂');location.href='index.html?team='+id}catch{document.querySelector('#error').textContent='浏览器暂时无法保存数据，请检查存储空间。'}};
</script></html>
